<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>影像尺寸測量工具（校正 + 自動邊緣）</title>
  <style>
    :root {
      --primary: #0d9488;
      --green: rgba(34, 197, 94, 0.28);
      --green-border: rgba(34, 197, 94, 0.85);
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* ========== 上方校正區 ========== */
    #calib-panel {
      background: var(--panel);
      padding: 8px 12px;
      border-bottom: 1px solid #334155;
      flex: 0 0 auto;
      flex-shrink: 0;
      z-index: 20;
      max-height: 42vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .calib-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }
    .calib-row:last-child { margin-bottom: 0; }
    label { font-size: 13px; color: var(--muted); white-space: nowrap; }
    input[type="number"], select {
      background: #0f172a;
      border: 1px solid #475569;
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 14px;
      width: 90px;
    }
    button, .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:active, .btn:active { opacity: 0.85; }
    button.secondary { background: #475569; }
    button.danger { background: #dc2626; }
    .hint { font-size: 12px; color: #38bdf8; width: 100%; }
    /* ========== 主內容區 ========== */
    #main {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    /* 左側 / 上方影像區 */
    #image-area {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #video, #canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #canvas { display: none; cursor: crosshair; touch-action: none; }
    #overlay-canvas {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
    }
    /* 右側工具列 (PC) */
    #toolbar {
      width: 140px;
      background: var(--panel);
      border-left: 1px solid #334155;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      overflow-y: auto;
    }
    #toolbar button {
      width: 100%;
      text-align: left;
      padding: 10px 8px;
    }
    #toolbar button.active {
      outline: 2px solid #2dd4bf;
      background: #0f766e;
    }
    /* 下方結果區：固定高度上限，多行結果在內部捲動，不擠壓影像區 */
    #result-panel {
      background: var(--panel);
      border-top: 1px solid #334155;
      padding: 8px 14px;
      flex: 0 0 auto;
      flex-shrink: 0;
      font-size: 14px;
      min-height: 52px;
      max-height: 132px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #result-panel .title { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    #result-text { line-height: 1.45; }
    #edge-gain-row { display: none; }

    /* ========== 手機版布局 (≤768px) ========== */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      #main {
        flex: 1 1 0;
        min-height: 0;
        flex-direction: column;
      }
      #image-area {
        flex: 1 1 0;
        min-height: 0;
      }
      /* 擷取後 canvas 以容器為基準，避免結果列變高造成縮放位移 */
      #canvas, #video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #toolbar {
        width: 100%;
        flex: 0 0 auto;
        flex-direction: row;
        overflow-x: auto;
        border-left: none;
        border-top: 1px solid #334155;
        border-bottom: 1px solid #334155;
        padding: 8px;
        gap: 6px;
      }
      #toolbar button {
        width: auto;
        flex-shrink: 0;
        padding: 10px 14px;
        font-size: 13px;
      }
      /* 手機結果區：固定上限高度，多層圓徑在此捲動，不擠影像 */
      #result-panel {
        font-size: 13px;
        max-height: 110px;
        min-height: 48px;
        flex: 0 0 auto;
      }
      input[type="number"] { width: 70px; }
    }
  </style>
</head>
<body>
  <!-- 上方校正區 -->
  <div id="calib-panel">
    <div class="calib-row">
      <label>實際尺寸</label>
      <input type="number" id="actual-size" value="10" min="0.01" step="0.01" />
      <select id="unit">
        <option value="mm">mm</option>
        <option value="µm">µm</option>
        <option value="cm">cm</option>
        <option value="inch">inch</option>
      </select>
      <label>尺規模式</label>
      <select id="scale-mode">
        <option value="line">水平/垂直尺規</option>
        <option value="circle">圓形尺規</option>
      </select>
      <button id="btn-toggle-scale" class="secondary">顯示半透明尺規</button>
      <button id="btn-finish-calib">完成校正</button>
      <button id="btn-recapture" class="secondary">重新開啟鏡頭</button>
    </div>
    <!-- 相機進階控制（僅在瀏覽器支援時顯示） -->
    <div class="calib-row" id="camera-controls" style="display:none;">
      <label id="zoom-label" style="display:none;">變焦</label>
      <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" style="display:none; width:120px;" />
      <span id="zoom-value" style="display:none; font-size:12px; color:#94a3b8;">1.0x</span>
      <button id="btn-torch" class="secondary" style="display:none;">開啟補光</button>
      <span id="cam-capability-hint" style="font-size:11px; color:#64748b;"></span>
    </div>
    <div class="calib-row" id="level-row" style="display:none; align-items:center; gap:10px;">
      <label>水平儀</label>
      <div id="level-indicator" style="display:flex; align-items:center; gap:8px; font-size:13px;">
        <span id="level-text" style="min-width:110px; color:#94a3b8;">等待感測器…</span>
        <div id="level-bar" style="width:80px; height:10px; background:#334155; border-radius:5px; position:relative; overflow:hidden;">
          <div id="level-bubble" style="position:absolute; top:1px; left:35px; width:10px; height:8px; background:#22c55e; border-radius:50%; transition:left 0.1s;"></div>
        </div>
        <span id="level-warn" style="color:#f87171; font-size:12px; display:none;">請保持水平</span>
      </div>
    </div>
    <div class="hint" id="calib-hint">建議流程（自動邊緣校正）：開啟鏡頭 → 按「擷取影像」→ 選「兩點距離」在已知尺寸物件上點選起點與終點（會出現綠色區塊並自動對邊）→ 輸入實際尺寸 → 按「完成校正」。半透明尺規為手動備援，不會產生綠色區塊。</div>
  </div>

  <!-- 主區域 -->
  <div id="main">
    <div id="image-area">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <!-- 用於繪製尺規、綠色區塊、量測結果的覆蓋層 -->
      <canvas id="overlay-canvas"></canvas>
    </div>

    <!-- 工具列 -->
    <div id="toolbar">
      <button id="tool-line" data-tool="line">兩點距離</button>
      <button id="tool-rect" data-tool="rect">矩形</button>
      <button id="tool-circle" data-tool="circle">圓形</button>
      <button id="btn-clear" class="secondary">清除量測</button>
      <button id="btn-recalib" class="secondary">重新校正</button>
      <button id="btn-capture">擷取影像</button>
    </div>
  </div>

  <!-- 下方結果（固定高度上限，多行在內部捲動，不擠壓影像） -->
  <div id="result-panel">
    <div class="title">量測結果（自動邊緣計算，降低人為誤差）</div>
    <div id="result-text">請先完成校正並擷取影像，再使用工具進行量測。</div>
    <!-- 邊緣增益放在結果區內，避免上方列變高擠壓影像 -->
    <div id="edge-gain-row" style="display:none; align-items:center; gap:8px; flex-wrap:wrap; margin-top:6px; padding-top:6px; border-top:1px solid #334155;">
      <label style="font-size:12px;" title="調低可過濾雜訊、讓準心卡在強邊緣；調高則更靈敏但易受雜訊影響">邊緣增益</label>
      <input type="range" id="edge-gain" min="0.3" max="3.0" step="0.1" value="1.0" style="width:120px; accent-color:#0d9488;" />
      <span id="edge-gain-value" style="font-size:12px; min-width:32px; color:#2dd4bf;">1.0</span>
      <span style="font-size:11px; color:#94a3b8;">← 雜訊　靈敏 →</span>
      <button id="btn-recalc-edge" class="secondary" style="padding:4px 8px; font-size:11px;">重算邊緣</button>
    </div>
  </div>

  <script>
    // ==================== 全域狀態 ====================
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const octx = overlay.getContext('2d');

    let stream = null;
    let videoTrack = null;          // 目前的 video track，用來套用 zoom / torch
    let isCaptured = false;
    let pixelsPerUnit = 0;          // 校正後：每單位實際長度對應的像素數
    let currentUnit = 'mm';
    let scaleVisible = false;
    let scaleMode = 'line';         // 'line' | 'circle'
    let currentTool = null;         // 'line' | 'rect' | 'circle' | null
    let torchOn = false;

    // 尺規狀態
    let lineScale = { x1: 80, y1: 120, x2: 280, y2: 120 }; // 水平尺規預設
    let circleScale = { cx: 200, cy: 200, r: 80 };
    let dragging = null; // { type: 'line-end1'|'line-end2'|'circle-center'|'circle-radius', ... }

    // 量測狀態
    let measurePoints = [];         // 當前工具的點（最多存起點）
    let liveEnd = null;             // 即時預覽的終點位置
    let greenRegion = null;         // 綠色區塊描述
    let lastResult = null;
    // 最近一次完整選取（起點+終點），供邊緣增益重算使用；不會在量測後被清空
    let lastSelection = null;       // { tool, p0, p1 }
    let edgeGain = 1.0;             // 邊緣增益：>1 更靈敏，<1 過濾雜訊（提高門檻）
    // 基準雜訊門檻（梯度絕對值）；實際門檻 = BASE_EDGE_THRESHOLD / edgeGain
    const BASE_EDGE_THRESHOLD = 28;

    // ==================== 初始化鏡頭 ====================
    async function startCamera() {
      // 檢查是否為安全環境（HTTPS 或 localhost）
      const isSecure = window.isSecureContext || location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      
      if (!isSecure) {
        const currentUrl = location.href;
        const msg = `目前不是安全環境，無法使用相機。\n\n目前網址：${currentUrl}\n\n原因：手機瀏覽器只允許在 HTTPS 或 localhost 下開啟相機。\n透過 http://樹莓派IP 存取屬於非安全連線，瀏覽器會直接封鎖 getUserMedia。\n\n【推薦解決方法（由快到穩）】\n1. 使用 cloudflared 或 ngrok 建立暫時 HTTPS 隧道（最快，約1分鐘）\n2. 在樹莓派設定自簽 HTTPS 憑證\n3. 把檔案放到 GitHub Pages / Netlify 等免費 HTTPS 空間\n\n詳細步驟請看後續說明。`;
        alert(msg);
        updateHint('請改用 HTTPS 連線。目前為 http://IP 非安全環境，相機被瀏覽器封鎖。');
        document.getElementById('result-text').textContent = '相機無法使用：需要 HTTPS 環境（目前為 http://IP）。';
        return;
      }

      // 檢查 mediaDevices 支援
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        // 嘗試舊版 API（極少數舊瀏覽器）
        const getUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia;
        if (!getUserMedia) {
          alert('此瀏覽器不支援相機存取（getUserMedia）。\n請改用最新版 Chrome、Safari 或 Edge。');
          updateHint('瀏覽器不支援相機 API。');
          return;
        }
        // 舊版 callback 寫法（很少需要）
        alert('偵測到較舊的瀏覽器 API，建議更新瀏覽器以獲得最佳體驗。');
      }

      try {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
        }

        const constraints = {
          video: {
            facingMode: { ideal: 'environment' },  // 優先後置鏡頭
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.style.display = 'block';
        canvas.style.display = 'none';
        isCaptured = false;
        pixelsPerUnit = 0;
        torchOn = false;

        // 取得 video track 並偵測可用能力
        videoTrack = stream.getVideoTracks()[0] || null;
        setupCameraControls(videoTrack);

        updateHint('鏡頭已開啟。建議：先按「擷取影像」→ 用「兩點距離」選已知長度（出現綠色區塊＝自動邊緣）→ 輸入實際尺寸 →「完成校正」。半透明尺規僅為手動備援。');
        document.getElementById('result-text').textContent = '請先完成校正並擷取影像。';
        resizeOverlay();
      } catch (err) {
        let msg = '無法開啟鏡頭：' + (err.message || err.name || '未知錯誤');
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          msg += '\n\n請到瀏覽器設定中允許此網站使用相機，然後重新整理頁面。';
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
          msg += '\n\n找不到可用的相機裝置。';
        } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
          msg += '\n\n相機可能被其他應用程式占用，請關閉其他使用相機的 App 後重試。';
        } else {
          msg += '\n\n請確認：\n• 已允許相機權限\n• 使用 HTTPS 或 localhost 開啟\n• 瀏覽器為最新版本';
        }
        alert(msg);
        updateHint('相機開啟失敗，請檢查權限與環境。');
        document.getElementById('result-text').textContent = '相機開啟失敗。';
      }
    }

    // ==================== 相機進階控制（變焦 / 補光） ====================
    function setupCameraControls(track) {
      const controls = document.getElementById('camera-controls');
      const zoomLabel = document.getElementById('zoom-label');
      const zoomSlider = document.getElementById('zoom-slider');
      const zoomValue = document.getElementById('zoom-value');
      const btnTorch = document.getElementById('btn-torch');
      const hint = document.getElementById('cam-capability-hint');

      // 先全部隱藏
      controls.style.display = 'none';
      zoomLabel.style.display = 'none';
      zoomSlider.style.display = 'none';
      zoomValue.style.display = 'none';
      btnTorch.style.display = 'none';
      hint.textContent = '';

      if (!track || typeof track.getCapabilities !== 'function') {
        hint.textContent = '此瀏覽器／裝置不支援進階相機控制（常見於 iOS Safari）';
        controls.style.display = 'flex';
        return;
      }

      const caps = track.getCapabilities();
      let hasAny = false;
      let messages = [];

      // 變焦（Zoom）
      if (caps.zoom) {
        const min = caps.zoom.min || 1;
        const max = caps.zoom.max || 1;
        const step = caps.zoom.step || 0.1;
        if (max > min) {
          zoomSlider.min = min;
          zoomSlider.max = max;
          zoomSlider.step = step;
          zoomSlider.value = track.getSettings().zoom || min;
          zoomValue.textContent = Number(zoomSlider.value).toFixed(1) + 'x';
          zoomLabel.style.display = 'inline';
          zoomSlider.style.display = 'inline-block';
          zoomValue.style.display = 'inline';
          hasAny = true;
        }
      } else {
        messages.push('無變焦');
      }

      // 補光燈 / Torch（持續照明，非閃光）
      if (caps.torch) {
        btnTorch.style.display = 'inline-block';
        btnTorch.textContent = '開啟補光';
        hasAny = true;
      } else {
        messages.push('無補光燈');
      }

      // 其他常見但多數不支援的項目
      if (!caps.focusMode && !caps.focusDistance) messages.push('無手動對焦');
      if (!caps.iso) messages.push('無 ISO');
      if (!caps.exposureCompensation && !caps.exposureMode) messages.push('無曝光控制');

      if (hasAny) {
        controls.style.display = 'flex';
        hint.textContent = messages.length ? ('不支援：' + messages.join('、')) : '變焦 / 補光可用';
      } else {
        controls.style.display = 'flex';
        hint.textContent = '此裝置不支援變焦、補光、ISO、手動對焦等進階控制（瀏覽器限制）';
      }
    }

    // 套用變焦
    async function applyZoom(value) {
      if (!videoTrack) return;
      try {
        await videoTrack.applyConstraints({ advanced: [{ zoom: Number(value) }] });
        document.getElementById('zoom-value').textContent = Number(value).toFixed(1) + 'x';
      } catch (e) {
        console.warn('變焦失敗', e);
      }
    }

    // 開關補光燈
    async function toggleTorch() {
      if (!videoTrack) return;
      try {
        torchOn = !torchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
        const btn = document.getElementById('btn-torch');
        btn.textContent = torchOn ? '關閉補光' : '開啟補光';
        btn.style.background = torchOn ? '#ca8a04' : '';
      } catch (e) {
        console.warn('補光燈切換失敗', e);
        alert('此裝置無法控制補光燈');
        torchOn = false;
      }
    }

    // ==================== 尺寸與覆蓋層同步 ====================
    function resizeOverlay() {
      const area = document.getElementById('image-area');
      const rect = area.getBoundingClientRect();
      // 已擷取後：鎖定為 canvas 緩衝尺寸，避免結果列／工具列變高造成座標系偏移
      if (isCaptured && canvas.width > 0 && canvas.height > 0) {
        overlay.width = canvas.width;
        overlay.height = canvas.height;
        overlay.style.width = canvas.width + 'px';
        overlay.style.height = canvas.height + 'px';
        // 讓 overlay 與 canvas 同位置對齊（置中於 image-area）
        const scale = Math.min(rect.width / canvas.width, rect.height / canvas.height);
        const dispW = canvas.width * scale;
        const dispH = canvas.height * scale;
        const ox = (rect.width - dispW) / 2;
        const oy = (rect.height - dispH) / 2;
        overlay.style.left = ox + 'px';
        overlay.style.top = oy + 'px';
        overlay.style.width = dispW + 'px';
        overlay.style.height = dispH + 'px';
        // 注意：width/height 屬性仍為 canvas 像素座標，style 只負責顯示縮放
        canvas.style.width = dispW + 'px';
        canvas.style.height = dispH + 'px';
        drawOverlay();
        return;
      }
      const w = Math.floor(rect.width);
      const h = Math.floor(rect.height);
      overlay.width = w;
      overlay.height = h;
      overlay.style.left = '0';
      overlay.style.top = '0';
      overlay.style.width = w + 'px';
      overlay.style.height = h + 'px';
      drawOverlay();
    }
    window.addEventListener('resize', resizeOverlay);

    // ==================== 繪製覆蓋層（尺規 + 綠色區塊 + 量測標記） ====================
    function drawOverlay() {
      octx.clearRect(0, 0, overlay.width, overlay.height);

      // 1. 半透明尺規（提高可見度）
      if (scaleVisible && !isCaptured) {
        octx.save();
        // 先畫一層半透明底，增加對比
        octx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        octx.fillRect(0, 0, overlay.width, overlay.height);

        octx.globalAlpha = 0.92;
        octx.strokeStyle = '#facc15';   // 亮黃色，更醒目
        octx.fillStyle = '#facc15';
        octx.lineWidth = 4;
        octx.setLineDash([]);

        if (scaleMode === 'line') {
          octx.beginPath();
          octx.moveTo(lineScale.x1, lineScale.y1);
          octx.lineTo(lineScale.x2, lineScale.y2);
          octx.stroke();
          // 兩端控制點（更大更明顯）
          drawHandle(lineScale.x1, lineScale.y1, 12);
          drawHandle(lineScale.x2, lineScale.y2, 12);
          // 刻度示意
          const dx = lineScale.x2 - lineScale.x1;
          const dy = lineScale.y2 - lineScale.y1;
          const len = Math.hypot(dx, dy) || 1;
          const ux = dx / len, uy = dy / len;
          octx.lineWidth = 3;
          for (let i = 0; i <= 10; i++) {
            const t = i / 10;
            const px = lineScale.x1 + dx * t;
            const py = lineScale.y1 + dy * t;
            const tick = (i % 5 === 0) ? 14 : 8;
            octx.beginPath();
            octx.moveTo(px - uy * tick, py + ux * tick);
            octx.lineTo(px + uy * tick, py - ux * tick);
            octx.stroke();
          }
        } else {
          // 圓形尺規
          octx.lineWidth = 4;
          octx.beginPath();
          octx.arc(circleScale.cx, circleScale.cy, circleScale.r, 0, Math.PI * 2);
          octx.stroke();
          // 十字中心
          octx.lineWidth = 3;
          octx.beginPath();
          octx.moveTo(circleScale.cx - 14, circleScale.cy);
          octx.lineTo(circleScale.cx + 14, circleScale.cy);
          octx.moveTo(circleScale.cx, circleScale.cy - 14);
          octx.lineTo(circleScale.cx, circleScale.cy + 14);
          octx.stroke();
          drawHandle(circleScale.cx, circleScale.cy, 12);
          drawHandle(circleScale.cx + circleScale.r, circleScale.cy, 12);
        }
        octx.restore();
      }

      // 2. 綠色半透明區塊（量測時，提高可見度）
      if (greenRegion && isCaptured) {
        octx.save();
        octx.fillStyle = 'rgba(34, 197, 94, 0.38)';
        octx.strokeStyle = 'rgba(22, 163, 74, 1)';
        octx.lineWidth = 3;
        octx.setLineDash([]);

        if (greenRegion.type === 'band') {
          // 帶狀（兩點距離）
          drawBand(greenRegion.x1, greenRegion.y1, greenRegion.x2, greenRegion.y2, greenRegion.width);
        } else if (greenRegion.type === 'rect') {
          octx.fillRect(greenRegion.x, greenRegion.y, greenRegion.w, greenRegion.h);
          octx.strokeRect(greenRegion.x, greenRegion.y, greenRegion.w, greenRegion.h);
        } else if (greenRegion.type === 'circle') {
          // 填滿整個選取圓盤，確保內側小孔也在自動邊緣計算範圍內
          octx.beginPath();
          octx.arc(greenRegion.cx, greenRegion.cy, greenRegion.r + (greenRegion.expand || 0), 0, Math.PI * 2);
          octx.fill();
          octx.stroke();
        }
        octx.restore();
      }

      // 3. 量測標記與自動邊緣點
      if (lastResult && isCaptured) {
        octx.save();
        octx.strokeStyle = '#f472b6';
        octx.fillStyle = '#f472b6';
        octx.lineWidth = 2;
        octx.setLineDash([]);

        if (lastResult.tool === 'line' && lastResult.autoStart && lastResult.autoEnd) {
          octx.beginPath();
          octx.moveTo(lastResult.autoStart.x, lastResult.autoStart.y);
          octx.lineTo(lastResult.autoEnd.x, lastResult.autoEnd.y);
          octx.stroke();
          drawCross(lastResult.autoStart.x, lastResult.autoStart.y);
          drawCross(lastResult.autoEnd.x, lastResult.autoEnd.y);
        } else if (lastResult.tool === 'rect' && lastResult.outer) {
          const r = lastResult.outer;
          octx.strokeRect(r.x, r.y, r.w, r.h);
          if (lastResult.inner) {
            const i = lastResult.inner;
            octx.setLineDash([4, 3]);
            octx.strokeRect(i.x, i.y, i.w, i.h);
          }
        } else if (lastResult.tool === 'circle') {
          const radiiToDraw = lastResult.radii && lastResult.radii.length
            ? lastResult.radii
            : (lastResult.outerR ? [lastResult.outerR, lastResult.innerR].filter(Boolean) : []);
          radiiToDraw.forEach((rad, idx) => {
            octx.beginPath();
            octx.arc(lastResult.cx, lastResult.cy, rad, 0, Math.PI * 2);
            octx.setLineDash(idx === 0 ? [] : [5, 4]);
            octx.stroke();
          });
          drawCross(lastResult.cx, lastResult.cy);
        }
        octx.restore();
      }

      // 4. 當前正在畫的臨時圖形
      if (measurePoints.length > 0 && currentTool) {
        octx.save();
        octx.strokeStyle = '#a78bfa';
        octx.lineWidth = 1.5;
        octx.setLineDash([4, 3]);
        if (currentTool === 'line' && measurePoints.length === 1) {
          // 等第二點
        } else if (currentTool === 'line' && measurePoints.length === 2) {
          octx.beginPath();
          octx.moveTo(measurePoints[0].x, measurePoints[0].y);
          octx.lineTo(measurePoints[1].x, measurePoints[1].y);
          octx.stroke();
        } else if (currentTool === 'rect' && measurePoints.length === 2) {
          const x = Math.min(measurePoints[0].x, measurePoints[1].x);
          const y = Math.min(measurePoints[0].y, measurePoints[1].y);
          const w = Math.abs(measurePoints[1].x - measurePoints[0].x);
          const h = Math.abs(measurePoints[1].y - measurePoints[0].y);
          octx.strokeRect(x, y, w, h);
        } else if (currentTool === 'circle' && measurePoints.length === 2) {
          const r = Math.hypot(measurePoints[1].x - measurePoints[0].x, measurePoints[1].y - measurePoints[0].y);
          octx.beginPath();
          octx.arc(measurePoints[0].x, measurePoints[0].y, r, 0, Math.PI * 2);
          octx.stroke();
        }
        octx.restore();
      }
    }

    function drawHandle(x, y, radius = 9) {
      octx.beginPath();
      octx.arc(x, y, radius, 0, Math.PI * 2);
      octx.fill();
      octx.strokeStyle = '#fff';
      octx.lineWidth = 2;
      octx.stroke();
    }
    function drawCross(x, y) {
      octx.beginPath();
      octx.moveTo(x - 7, y); octx.lineTo(x + 7, y);
      octx.moveTo(x, y - 7); octx.lineTo(x, y + 7);
      octx.stroke();
    }
    function drawBand(x1, y1, x2, y2, width) {
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const ux = -dy / len * width, uy = dx / len * width;
      octx.beginPath();
      octx.moveTo(x1 + ux, y1 + uy);
      octx.lineTo(x2 + ux, y2 + uy);
      octx.lineTo(x2 - ux, y2 - uy);
      octx.lineTo(x1 - ux, y1 - uy);
      octx.closePath();
      octx.fill();
      octx.stroke();
    }

    // ==================== 校正完成 ====================
    function finishCalibration() {
      const actual = parseFloat(document.getElementById('actual-size').value);
      if (!actual || actual <= 0) {
        alert('請輸入有效的實際尺寸');
        return;
      }
      currentUnit = document.getElementById('unit').value;

      // 優先使用「自動邊緣偵測」得到的像素距離（降低人為誤差）
      let pixelLen = 0;
      let method = '';

      if (lastPixelForCalib > 5) {
        pixelLen = lastPixelForCalib;
        method = '自動邊緣偵測';
      } else if (scaleVisible) {
        // 後備：使用手動尺規
        if (scaleMode === 'line') {
          pixelLen = Math.hypot(lineScale.x2 - lineScale.x1, lineScale.y2 - lineScale.y1);
        } else {
          pixelLen = circleScale.r * 2;
        }
        method = '手動尺規';
      }

      if (pixelLen < 5) {
        alert('【自動邊緣校正】請先擷取影像 → 選「兩點距離」在已知尺寸物件上點選兩點（會出現綠色區塊並自動對邊）→ 輸入實際尺寸後再按完成校正。\n\n【手動備援】也可開啟「半透明尺規」拖曳對齊後直接完成校正（不會出現綠色區塊）。');
        return;
      }

      pixelsPerUnit = pixelLen / actual;
      scaleVisible = false;
      document.getElementById('btn-toggle-scale').textContent = '顯示半透明尺規';
      updateHint(`校正完成！（${method}）比例 = ${pixelsPerUnit.toFixed(2)} px / ${currentUnit}。現在可以使用其他工具進行量測。`);
      document.getElementById('result-text').innerHTML =
        `校正完成<br>使用方式：${method}<br>像素距離：${pixelLen.toFixed(1)} px → 實際：${actual} ${currentUnit}<br>` +
        `比例：${pixelsPerUnit.toFixed(2)} px / ${currentUnit}`;
      drawOverlay();
    }

    // ==================== 擷取影像 ====================
    function captureImage() {
      if (!stream && !video.srcObject) {
        // 若已關閉串流但仍有最後一幀，允許重擷取提示
        if (!isCaptured) {
          alert('請先開啟鏡頭');
          return;
        }
      }
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if ((!vw || !vh) && !isCaptured) {
        alert('鏡頭尚未就緒，請稍候再試');
        return;
      }
      if (vw && vh) {
        // 將 video 畫到 canvas，保持比例並置中於 overlay 尺寸
        const area = document.getElementById('image-area');
        const rect = area.getBoundingClientRect();
        const areaW = rect.width;
        const areaH = rect.height;
        const scale = Math.min(areaW / vw, areaH / vh);
        const drawW = vw * scale;
        const drawH = vh * scale;
        const offsetX = (areaW - drawW) / 2;
        const offsetY = (areaH - drawH) / 2;

        canvas.width = areaW;
        canvas.height = areaH;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, areaW, areaH);
        ctx.drawImage(video, offsetX, offsetY, drawW, drawH);
      }

      // 關閉相機串流，釋放硬體（不再背景持續開啟）
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        videoTrack = null;
        video.srcObject = null;
      }
      document.getElementById('camera-controls').style.display = 'none';

      video.style.display = 'none';
      canvas.style.display = 'block';
      isCaptured = true;
      measurePoints = [];
      liveEnd = null;
      greenRegion = null;
      lastResult = null;
      lastSelection = null;
      dragging = null;
      if (pixelsPerUnit <= 0) {
        updateHint('影像已擷取，相機已關閉。直線已知物：用「兩點距離」；圓形已知物：用「圓形」點中心→邊緣。完成後可調邊緣增益，再輸入實際尺寸按「完成校正」。');
        document.getElementById('result-text').textContent = '尚未校正。直線用兩點距離；圓形尺規建議用「圓形」工具選外徑後完成校正。';
      } else {
        updateHint('影像已擷取，相機已關閉。選擇工具後，點選起點會即時顯示綠色邊緣範圍，確認後再點終點即可自動計算。完成後可用邊緣增益微調。');
        document.getElementById('result-text').textContent = '請選擇量測工具並在影像上操作。';
      }
      // 同步 overlay 與 canvas 顯示尺寸（手機結果列變動時也不錯位）
      resizeOverlay();
    }

    // ==================== 簡易邊緣偵測（純 JS，降低人為誤差） ====================
    // 在指定區域內找梯度最強的點
    function getImageDataSafe() {
      try {
        return ctx.getImageData(0, 0, canvas.width, canvas.height);
      } catch (e) {
        return null;
      }
    }

    function gradientAt(imgData, x, y) {
      const w = imgData.width, h = imgData.height;
      x = Math.max(1, Math.min(w - 2, Math.round(x)));
      y = Math.max(1, Math.min(h - 2, Math.round(y)));
      const idx = (y * w + x) * 4;
      const data = imgData.data;
      // 簡單 Sobel 近似（灰階）
      const gray = (i) => 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
      const tl = gray(idx - w*4 - 4), tc = gray(idx - w*4), tr = gray(idx - w*4 + 4);
      const ml = gray(idx - 4),           mr = gray(idx + 4);
      const bl = gray(idx + w*4 - 4), bc = gray(idx + w*4), br = gray(idx + w*4 + 4);
      const gx = -tl + tr - 2*ml + 2*mr - bl + br;
      const gy = -tl - 2*tc - tr + bl + 2*bc + br;
      // 套用增益：放大梯度後再與門檻比較，利於過濾弱雜訊
      return (Math.abs(gx) + Math.abs(gy)) * edgeGain;
    }

    function getEdgeThreshold() {
      // 增益越高 → 有效門檻越低（更靈敏）；增益越低 → 門檻越高（過濾雜訊）
      return BASE_EDGE_THRESHOLD;
    }

    // 兩點距離：在帶狀區域兩端找最強邊緣點（支援增益／門檻過濾雜訊）
    function autoEdgeLine(x1, y1, x2, y2, bandWidth) {
      const imgData = getImageDataSafe();
      if (!imgData) return { start: {x:x1,y:y1}, end: {x:x2,y:y2} };

      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const px = -uy, py = ux; // 垂直方向
      const minG = getEdgeThreshold();

      function findStrongestNear(cx, cy, searchRadius) {
        // 優先沿「垂直於量測線」方向搜尋真實邊緣，減少沿線雜訊干擾
        let best = { x: cx, y: cy, g: -1 };
        const normalSteps = Math.max(searchRadius, 12);
        // 1) 沿法線方向精細掃描（最能對準邊緣）
        for (let d = -normalSteps; d <= normalSteps; d++) {
          const sx = cx + px * d;
          const sy = cy + py * d;
          const proj = ((sx - x1) * ux + (sy - y1) * uy);
          if (proj < -8 || proj > len + 8) continue;
          const distToLine = Math.abs((sx - x1) * px + (sy - y1) * py);
          if (distToLine > bandWidth + 2) continue;
          const g = gradientAt(imgData, sx, sy);
          if (g < minG) continue; // 低於門檻視為雜訊，略過
          if (g > best.g) best = { x: sx, y: sy, g };
        }
        // 2) 若法線方向找不到夠強的點，再做小範圍環狀備援搜尋
        if (best.g < minG) {
          for (let r = 0; r <= searchRadius; r += 1) {
            for (let a = 0; a < 20; a++) {
              const ang = (a / 20) * Math.PI * 2;
              const sx = cx + Math.cos(ang) * r;
              const sy = cy + Math.sin(ang) * r;
              const proj = ((sx - x1) * ux + (sy - y1) * uy);
              if (proj < -5 || proj > len + 5) continue;
              const distToLine = Math.abs((sx - x1) * px + (sy - y1) * py);
              if (distToLine > bandWidth) continue;
              const g = gradientAt(imgData, sx, sy);
              if (g < minG) continue;
              if (g > best.g) best = { x: sx, y: sy, g };
            }
          }
        }
        // 若仍無合格邊緣，退回原點（不亂跳）
        if (best.g < 0) return { x: cx, y: cy, g: 0 };
        return best;
      }

      const searchR = Math.max(bandWidth, 18);
      const start = findStrongestNear(x1, y1, searchR);
      const end   = findStrongestNear(x2, y2, searchR);
      return { start: { x: start.x, y: start.y }, end: { x: end.x, y: end.y } };
    }

    // 矩形：在四邊擴張區域找強邊緣，嘗試偵測內外
    function autoEdgeRect(rx, ry, rw, rh, expand) {
      const imgData = getImageDataSafe();
      if (!imgData) {
        return { outer: { x: rx, y: ry, w: rw, h: rh }, inner: null };
      }

      // 簡化：對每條邊取中點附近最強梯度位置，微調邊界
      function sampleEdge(x0, y0, x1, y1, outwardX, outwardY) {
        const samples = [];
        const steps = 12;
        const minG = getEdgeThreshold();
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const bx = x0 + (x1 - x0) * t;
          const by = y0 + (y1 - y0) * t;
          let bestG = -1, bestD = 0;
          for (let d = -expand; d <= expand; d++) {
            const sx = bx + outwardX * d;
            const sy = by + outwardY * d;
            const g = gradientAt(imgData, sx, sy);
            if (g < minG) continue; // 低於門檻略過雜訊
            if (g > bestG) { bestG = g; bestD = d; }
          }
          // 若此點整條掃描都沒有合格邊緣，維持 0（不偏移）
          samples.push(bestG >= minG ? bestD : 0);
        }
        // 取中位數
        samples.sort((a,b)=>a-b);
        return samples[Math.floor(samples.length/2)];
      }

      const leftD  = sampleEdge(rx, ry, rx, ry+rh, -1, 0);
      const rightD = sampleEdge(rx+rw, ry, rx+rw, ry+rh, 1, 0);
      const topD   = sampleEdge(rx, ry, rx+rw, ry, 0, -1);
      const botD   = sampleEdge(rx, ry+rh, rx+rw, ry+rh, 0, 1);

      const outer = {
        x: rx + leftD,
        y: ry + topD,
        w: rw + (rightD - leftD),
        h: rh + (botD - topD)
      };

      // 嘗試找內框：在更內側再搜一次（簡化版，實際可再優化）
      let inner = null;
      if (rw > 30 && rh > 30) {
        const inset = Math.min(rw, rh) * 0.15;
        const ix = rx + inset, iy = ry + inset, iw = rw - inset*2, ih = rh - inset*2;
        const iLeft  = sampleEdge(ix, iy, ix, iy+ih, -1, 0);
        const iRight = sampleEdge(ix+iw, iy, ix+iw, iy+ih, 1, 0);
        const iTop   = sampleEdge(ix, iy, ix+iw, iy, 0, -1);
        const iBot   = sampleEdge(ix, iy+ih, ix+iw, iy+ih, 0, 1);
        inner = {
          x: ix + iLeft,
          y: iy + iTop,
          w: iw + (iRight - iLeft),
          h: ih + (iBot - iTop)
        };
        // 若內外差異太小則忽略內框
        if (Math.abs(inner.w - outer.w) < 4 && Math.abs(inner.h - outer.h) < 4) {
          inner = null;
        }
      }
      return { outer, inner };
    }

    // 圓形：在整個選取半徑內找多層同心邊緣（外徑 + 多個內徑）
    function autoEdgeCircle(cx, cy, r, expand) {
      const imgData = getImageDataSafe();
      if (!imgData) return { cx, cy, radii: [r], outerR: r, innerR: null };

      const maxR = Math.max(r + expand, 8);
      const angles = 48;
      const step = 1; // 徑向取樣間隔（像素）
      const profile = new Float32Array(Math.ceil(maxR) + 1);

      // 建立徑向平均梯度剖面
      for (let rad = 1; rad <= maxR; rad += step) {
        let sumG = 0, cnt = 0;
        for (let i = 0; i < angles; i++) {
          const ang = (i / angles) * Math.PI * 2;
          const sx = cx + Math.cos(ang) * rad;
          const sy = cy + Math.sin(ang) * rad;
          const g = gradientAt(imgData, sx, sy);
          sumG += g;
          cnt++;
        }
        profile[rad] = cnt ? sumG / cnt : 0;
      }

      // 找局部極大值（邊緣候選），需超過門檻且與鄰近峰有足夠距離
      // profile 已含 edgeGain，門檻用 getEdgeThreshold() 統一過濾雜訊
      const peaks = [];
      const minPeakDist = 4;
      const threshold = getEdgeThreshold() * 0.65; // 剖面為多角度平均，略降門檻
      for (let rad = 3; rad < maxR - 1; rad++) {
        const g = profile[rad];
        if (g < threshold) continue;
        if (g >= profile[rad - 1] && g >= profile[rad + 1]) {
          // 非極大抑制：與已有峰太近就保留較強者
          let keep = true;
          for (let k = 0; k < peaks.length; k++) {
            if (Math.abs(peaks[k].r - rad) < minPeakDist) {
              if (g > peaks[k].g) {
                peaks[k] = { r: rad, g };
              }
              keep = false;
              break;
            }
          }
          if (keep) peaks.push({ r: rad, g });
        }
      }

      // 依半徑由大到小排序
      peaks.sort((a, b) => b.r - a.r);

      // 若找不到明顯邊緣，退回使用者粗選半徑
      if (peaks.length === 0) {
        return { cx, cy, radii: [r], outerR: r, innerR: null };
      }

      const radii = peaks.map(p => p.r);
      const outerR = radii[0];
      const innerR = radii.length > 1 ? radii[1] : null;
      return { cx, cy, radii, outerR, innerR };
    }

    // 最近一次自動邊緣得到的像素距離（供校正使用）
    let lastPixelForCalib = 0;

    // ==================== 執行量測（綠色區塊 + 自動邊緣） ====================
    function showEdgeGainControls(show) {
      const row = document.getElementById('edge-gain-row');
      if (row) row.style.display = show ? 'flex' : 'none';
      // 結果區內部捲動即可，不改變影像區高度，避免綠色區域位移
    }

    function performMeasure() {
      if (!isCaptured) {
        alert('請先擷取影像');
        return;
      }
      // 優先用當前暫存點；若已清空（量測完成後），改用 lastSelection 重算
      let p0 = measurePoints[0];
      let p1 = measurePoints[1] || liveEnd;
      let tool = currentTool;
      if ((!p0 || !p1) && lastSelection) {
        p0 = lastSelection.p0;
        p1 = lastSelection.p1;
        tool = lastSelection.tool || currentTool;
      }
      if (!p0 || !p1) return;
      const bandW = 16; // 綠色半寬
      // 選取完成後顯示增益調整列，方便即時過濾雜訊
      showEdgeGainControls(true);

      if (tool === 'line') {
        greenRegion = { type: 'band', x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y, width: bandW };
        const edges = autoEdgeLine(p0.x, p0.y, p1.x, p1.y, bandW);
        const pixelDist = Math.hypot(edges.end.x - edges.start.x, edges.end.y - edges.start.y);
        lastPixelForCalib = pixelDist;
        lastResult = {
          tool: 'line',
          autoStart: edges.start,
          autoEnd: edges.end,
          pixel: pixelDist,
          real: pixelsPerUnit > 0 ? pixelDist / pixelsPerUnit : null
        };

        if (pixelsPerUnit > 0) {
          const real = pixelDist / pixelsPerUnit;
          document.getElementById('result-text').innerHTML =
            `兩點距離（自動邊緣）<br>` +
            `像素距離：${pixelDist.toFixed(1)} px<br>` +
            `<strong>實際尺寸：${real.toFixed(3)} ${currentUnit}</strong>`;
        } else {
          document.getElementById('result-text').innerHTML =
            `校正用兩點距離（自動邊緣）<br>` +
            `偵測到像素距離：<strong>${pixelDist.toFixed(1)} px</strong><br>` +
            `請在上方輸入此段的「實際尺寸」，然後按「完成校正」。`;
        }
      }
      else if (tool === 'rect') {
        const x = Math.min(p0.x, p1.x);
        const y = Math.min(p0.y, p1.y);
        const w = Math.abs(p1.x - p0.x);
        const h = Math.abs(p1.y - p0.y);
        const expand = 12;
        greenRegion = { type: 'rect', x: x - expand, y: y - expand, w: w + expand*2, h: h + expand*2 };
        const edges = autoEdgeRect(x, y, w, h, expand);
        lastResult = { tool: 'rect', ...edges };

        if (pixelsPerUnit > 0) {
          const ow = edges.outer.w / pixelsPerUnit;
          const oh = edges.outer.h / pixelsPerUnit;
          let html = `矩形（自動邊緣）<br>外框：${ow.toFixed(3)} × ${oh.toFixed(3)} ${currentUnit}`;
          if (edges.inner) {
            const iw = edges.inner.w / pixelsPerUnit;
            const ih = edges.inner.h / pixelsPerUnit;
            const thickW = (edges.outer.w - edges.inner.w) / 2 / pixelsPerUnit;
            const thickH = (edges.outer.h - edges.inner.h) / 2 / pixelsPerUnit;
            html += `<br>內框：${iw.toFixed(3)} × ${ih.toFixed(3)} ${currentUnit}`;
            html += `<br>壁厚（約）：水平 ${thickW.toFixed(3)} / 垂直 ${thickH.toFixed(3)} ${currentUnit}`;
          }
          document.getElementById('result-text').innerHTML = html;
        } else {
          document.getElementById('result-text').innerHTML =
            `矩形邊緣已偵測（尚未校正）<br>請先用「兩點距離」對已知尺寸物件完成校正。`;
        }
      }
      else if (tool === 'circle') {
        const r = Math.hypot(p1.x - p0.x, p1.y - p0.y);
        const expand = 16;
        greenRegion = { type: 'circle', cx: p0.x, cy: p0.y, r: r, expand: expand };
        const edges = autoEdgeCircle(p0.x, p0.y, r, expand);
        lastResult = { tool: 'circle', ...edges };

        if (pixelsPerUnit > 0) {
          const radii = edges.radii || [edges.outerR];
          let html = `圓形（自動邊緣，共偵測 ${radii.length} 層）`;
          radii.forEach((rad, idx) => {
            const d = (rad * 2) / pixelsPerUnit;
            if (idx === 0) {
              html += `<br><strong>外徑：${d.toFixed(3)} ${currentUnit}</strong>`;
            } else {
              html += `<br>內徑 ${idx}：${d.toFixed(3)} ${currentUnit}`;
            }
          });
          if (radii.length >= 2) {
            const thick = (radii[0] - radii[1]) / pixelsPerUnit;
            html += `<br>最外層壁厚（約）：${thick.toFixed(3)} ${currentUnit}`;
          }
          document.getElementById('result-text').innerHTML = html;
        } else {
          // 圓形工具也可直接用於校正（以外徑像素當已知長度）
          const outerPx = (edges.outerR || r) * 2;
          lastPixelForCalib = outerPx;
          document.getElementById('result-text').innerHTML =
            `校正用圓形（自動邊緣）<br>` +
            `偵測到外徑像素：<strong>${outerPx.toFixed(1)} px</strong><br>` +
            `若此圓為已知實際直徑，請在上方輸入實際尺寸後按「完成校正」。`;
        }
      }
      drawOverlay();
    }

    // ==================== 事件處理 ====================
    function getPos(e) {
      const rect = overlay.getBoundingClientRect();
      // touchend 時 touches 為空，改用 changedTouches
      const t = (e.touches && e.touches[0])
        || (e.changedTouches && e.changedTouches[0])
        || e;
      const clientX = t.clientX;
      const clientY = t.clientY;
      // 顯示尺寸可能因 CSS 縮放與緩衝像素不同，需換算回 canvas／overlay 座標
      const scaleX = rect.width > 0 ? (overlay.width / rect.width) : 1;
      const scaleY = rect.height > 0 ? (overlay.height / rect.height) : 1;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    // 完成一次量測選取（共用：拖曳放開 或 第二次點擊）
    function finishMeasureSelection(p0, p1) {
      liveEnd = p1;
      measurePoints = [p0, p1];
      lastSelection = {
        tool: currentTool,
        p0: { x: p0.x, y: p0.y },
        p1: { x: p1.x, y: p1.y }
      };
      dragging = null;
      performMeasure();
      measurePoints = [];
      liveEnd = null;
    }

    // 尺規拖曳
    function onPointerDown(e) {
      // 量測 / 校正選取模式（已擷取影像後）
      if (isCaptured && currentTool) {
        e.preventDefault();
        const pos = getPos(e);

        if (measurePoints.length === 0) {
          // 按下：設定起點，開始拖曳預覽（手機：按住拖到終點再放開即可）
          measurePoints = [pos];
          liveEnd = pos;
          greenRegion = null;
          lastResult = null;
          dragging = { type: 'measure-live', startX: pos.x, startY: pos.y, moved: false };
          drawOverlay();
        } else {
          // 第二次點擊（未拖曳、僅輕點起點後再點終點的桌面習慣）
          finishMeasureSelection(measurePoints[0], pos);
        }
        return;
      }

      // 舊有尺規拖曳（校正輔助，可選）
      if (scaleVisible && !isCaptured) {
        e.preventDefault();
        const pos = getPos(e);
        const hitR = 20;
        if (scaleMode === 'line') {
          if (Math.hypot(pos.x - lineScale.x1, pos.y - lineScale.y1) < hitR) dragging = { type: 'line-end1' };
          else if (Math.hypot(pos.x - lineScale.x2, pos.y - lineScale.y2) < hitR) dragging = { type: 'line-end2' };
          else {
            const d = pointToSegmentDist(pos, lineScale.x1, lineScale.y1, lineScale.x2, lineScale.y2);
            if (d < 14) dragging = { type: 'line-move', ox: pos.x, oy: pos.y, lx1: lineScale.x1, ly1: lineScale.y1, lx2: lineScale.x2, ly2: lineScale.y2 };
          }
        } else {
          if (Math.hypot(pos.x - circleScale.cx, pos.y - circleScale.cy) < hitR) dragging = { type: 'circle-center' };
          else if (Math.hypot(pos.x - (circleScale.cx + circleScale.r), pos.y - circleScale.cy) < hitR) dragging = { type: 'circle-radius' };
          else if (Math.abs(Math.hypot(pos.x - circleScale.cx, pos.y - circleScale.cy) - circleScale.r) < 14) {
            dragging = { type: 'circle-radius' };
          }
        }
      }
    }

    function onPointerMove(e) {
      if (!dragging) return;
      e.preventDefault();
      const pos = getPos(e);

      // 量測即時綠色區塊預覽（按住拖曳時持續更新）
      if (dragging.type === 'measure-live' && measurePoints.length >= 1 && currentTool) {
        const p0 = measurePoints[0];
        const bandW = 16;
        liveEnd = pos;
        const movedDist = Math.hypot(pos.x - (dragging.startX ?? p0.x), pos.y - (dragging.startY ?? p0.y));
        if (movedDist >= 8) dragging.moved = true;

        if (currentTool === 'line') {
          greenRegion = { type: 'band', x1: p0.x, y1: p0.y, x2: pos.x, y2: pos.y, width: bandW };
        } else if (currentTool === 'rect') {
          const x = Math.min(p0.x, pos.x);
          const y = Math.min(p0.y, pos.y);
          const w = Math.abs(pos.x - p0.x);
          const h = Math.abs(pos.y - p0.y);
          const expand = 12;
          greenRegion = { type: 'rect', x: x - expand, y: y - expand, w: w + expand * 2, h: h + expand * 2 };
        } else if (currentTool === 'circle') {
          const r = Math.hypot(pos.x - p0.x, pos.y - p0.y);
          greenRegion = { type: 'circle', cx: p0.x, cy: p0.y, r: r, expand: 14 };
        }
        drawOverlay();
        return;
      }

      // 尺規拖曳
      if (dragging.type === 'line-end1') {
        lineScale.x1 = pos.x; lineScale.y1 = pos.y;
      } else if (dragging.type === 'line-end2') {
        lineScale.x2 = pos.x; lineScale.y2 = pos.y;
      } else if (dragging.type === 'line-move') {
        const dx = pos.x - dragging.ox, dy = pos.y - dragging.oy;
        lineScale.x1 = dragging.lx1 + dx; lineScale.y1 = dragging.ly1 + dy;
        lineScale.x2 = dragging.lx2 + dx; lineScale.y2 = dragging.ly2 + dy;
      } else if (dragging.type === 'circle-center') {
        circleScale.cx = pos.x; circleScale.cy = pos.y;
      } else if (dragging.type === 'circle-radius') {
        circleScale.r = Math.max(10, Math.hypot(pos.x - circleScale.cx, pos.y - circleScale.cy));
      }
      drawOverlay();
    }

    function onPointerUp(e) {
      // 滑鼠移出畫面時不結束量測，避免誤觸
      if (e.type === 'mouseleave') {
        if (dragging && dragging.type === 'measure-live') return;
        dragging = null;
        return;
      }

      if (dragging && dragging.type === 'measure-live' && measurePoints.length >= 1 && currentTool) {
        const pos = getPos(e);
        const p0 = measurePoints[0];
        const dist = Math.hypot(pos.x - p0.x, pos.y - p0.y);
        // 有實際拖曳（超過門檻）→ 放開即視為終點，完成量測（手機直覺操作）
        if (dragging.moved || dist >= 12) {
          finishMeasureSelection(p0, pos);
          return;
        }
        // 幾乎沒移動：視為「輕點起點」，保留起點等待第二次點擊（桌面兩點點選）
        liveEnd = p0;
        greenRegion = null;
        dragging = null;
        drawOverlay();
        return;
      }
      dragging = null;
    }

    function pointToSegmentDist(p, x1, y1, x2, y2) {
      const dx = x2 - x1, dy = y2 - y1;
      const len2 = dx*dx + dy*dy || 1;
      let t = ((p.x - x1)*dx + (p.y - y1)*dy) / len2;
      t = Math.max(0, Math.min(1, t));
      const px = x1 + t*dx, py = y1 + t*dy;
      return Math.hypot(p.x - px, p.y - py);
    }

    // 綁定事件
    overlay.style.pointerEvents = 'auto';
    overlay.addEventListener('mousedown', onPointerDown);
    overlay.addEventListener('mousemove', onPointerMove);
    overlay.addEventListener('mouseup', onPointerUp);
    overlay.addEventListener('mouseleave', onPointerUp);
    overlay.addEventListener('touchstart', onPointerDown, { passive: false });
    overlay.addEventListener('touchmove', onPointerMove, { passive: false });
    overlay.addEventListener('touchend', onPointerUp);

    // 按鈕事件
    document.getElementById('btn-toggle-scale').addEventListener('click', () => {
      scaleVisible = !scaleVisible;
      document.getElementById('btn-toggle-scale').textContent = scaleVisible ? '隱藏半透明尺規' : '顯示半透明尺規';
      drawOverlay();
    });
    document.getElementById('btn-finish-calib').addEventListener('click', finishCalibration);
    document.getElementById('btn-recapture').addEventListener('click', () => {
      startCamera();
      scaleVisible = false;
      document.getElementById('btn-toggle-scale').textContent = '顯示半透明尺規';
    });
    document.getElementById('btn-capture').addEventListener('click', captureImage);
    document.getElementById('btn-clear').addEventListener('click', () => {
      measurePoints = [];
      liveEnd = null;
      greenRegion = null;
      lastResult = null;
      lastSelection = null;
      dragging = null;
      showEdgeGainControls(false);
      document.getElementById('result-text').textContent = '已清除量測。';
      drawOverlay();
    });
    document.getElementById('btn-recalib').addEventListener('click', () => {
      pixelsPerUnit = 0;
      lastPixelForCalib = 0;
      scaleVisible = false;
      document.getElementById('btn-toggle-scale').textContent = '顯示半透明尺規';
      measurePoints = [];
      liveEnd = null;
      greenRegion = null;
      lastResult = null;
      lastSelection = null;
      dragging = null;
      isCaptured = false;
      showEdgeGainControls(false);
      // 相機已在擷取時關閉，重新開啟
      startCamera();
      updateHint('已重置並重新開啟鏡頭。請擷取影像後，用「兩點距離」或「圓形」選取已知尺寸物件完成校正。');
      drawOverlay();
    });

    document.getElementById('scale-mode').addEventListener('change', (e) => {
      scaleMode = e.target.value;
      drawOverlay();
    });

    // 相機進階控制事件
    document.getElementById('zoom-slider').addEventListener('input', (e) => {
      applyZoom(e.target.value);
    });
    document.getElementById('btn-torch').addEventListener('click', toggleTorch);

    // 工具選擇
    document.querySelectorAll('#toolbar [data-tool]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#toolbar [data-tool]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
        measurePoints = [];
        liveEnd = null;
        greenRegion = null;
        lastResult = null;
        lastSelection = null;
        dragging = null;
        showEdgeGainControls(false);
        drawOverlay();
        updateHint(`已選擇「${btn.textContent}」。手機：按住起點拖到終點再放開即可；桌面也可點兩下。拖曳時會顯示綠色範圍，放開後自動對邊。完成後可用邊緣增益微調。`);
      });
    });

    // 邊緣增益滑桿：即時重算
    const edgeGainSlider = document.getElementById('edge-gain');
    const edgeGainValue = document.getElementById('edge-gain-value');
    function applyEdgeGainFromUI() {
      edgeGain = parseFloat(edgeGainSlider.value) || 1.0;
      edgeGainValue.textContent = edgeGain.toFixed(1);
      // 使用 lastSelection（量測完成後仍保留），即時重算邊緣與粉紅準心
      if (isCaptured && lastSelection && lastSelection.p0 && lastSelection.p1) {
        performMeasure();
      }
    }
    edgeGainSlider.addEventListener('input', applyEdgeGainFromUI);
    document.getElementById('btn-recalc-edge').addEventListener('click', () => {
      if (isCaptured && lastSelection && lastSelection.p0 && lastSelection.p1) {
        performMeasure();
      } else {
        alert('請先完成綠色範圍選取（點選起點與終點）後再調整增益。');
      }
    });

    function updateHint(msg) {
      document.getElementById('calib-hint').textContent = msg;
    }

    // ==================== 手機水平儀（DeviceOrientation） ====================
    let levelActive = false;
    function updateLevelUI(beta, gamma) {
      // beta: 前後傾斜（-180~180），gamma: 左右（-90~90）
      // 以螢幕朝上時接近 0 為水平參考；手機直立拍攝時 beta≈90
      const absBeta = Math.abs(beta);
      const absGamma = Math.abs(gamma);
      // 判斷「接近水平放置」或「直立但左右不歪」：用 gamma 為主（左右歪斜最影響量測）
      const tilt = Math.sqrt(gamma * gamma + Math.min(absBeta, 20) * Math.min(absBeta, 20) * 0.25);
      const textEl = document.getElementById('level-text');
      const bubble = document.getElementById('level-bubble');
      const warn = document.getElementById('level-warn');
      const barW = 80;
      // 把 gamma 映射到 bubble 位置（±15° 為合理範圍）
      const clamped = Math.max(-15, Math.min(15, gamma));
      const left = ((clamped + 15) / 30) * (barW - 10);
      bubble.style.left = left + 'px';
      const ok = Math.abs(gamma) < 3 && (absBeta < 12 || Math.abs(absBeta - 90) < 12);
      bubble.style.background = ok ? '#22c55e' : (Math.abs(gamma) < 6 ? '#eab308' : '#ef4444');
      textEl.textContent = `前後 ${beta.toFixed(1)}° / 左右 ${gamma.toFixed(1)}°`;
      textEl.style.color = ok ? '#86efac' : '#fbbf24';
      warn.style.display = ok ? 'none' : 'inline';
    }

    function startLevelSensor() {
      const row = document.getElementById('level-row');
      // 僅在觸控／窄螢幕顯示
      const isMobile = window.matchMedia('(max-width: 768px)').matches ||
        ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      if (!isMobile) return;

      const enable = () => {
        row.style.display = 'flex';
        levelActive = true;
        window.addEventListener('deviceorientation', (e) => {
          if (e.beta == null || e.gamma == null) return;
          updateLevelUI(e.beta, e.gamma);
        });
      };

      // iOS 13+ 需權限
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        // 延後到使用者互動時請求
        const ask = () => {
          DeviceOrientationEvent.requestPermission()
            .then(state => { if (state === 'granted') enable(); })
            .catch(() => {});
          document.body.removeEventListener('click', ask);
          document.body.removeEventListener('touchstart', ask);
        };
        document.body.addEventListener('click', ask, { once: true });
        document.body.addEventListener('touchstart', ask, { once: true });
        row.style.display = 'flex';
        document.getElementById('level-text').textContent = '點擊畫面以啟用水平儀';
      } else if (window.DeviceOrientationEvent) {
        enable();
      }
    }

    // 啟動
    startCamera();
    startLevelSensor();
    setTimeout(resizeOverlay, 300);
    setTimeout(resizeOverlay, 1000);
  </script>
</body>
</html>
