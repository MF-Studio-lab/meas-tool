<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>影像尺寸測量工具（校正 + 自動邊緣）</title>
  <style>
    :root {
      --primary: #0d9488;
      --green: rgba(34, 197, 94, 0.28);
      --green-border: rgba(34, 197, 94, 0.85);
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* ========== 上方校正區 ========== */
    #calib-panel {
      background: var(--panel);
      padding: 8px 12px;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
      z-index: 20;
    }
    .calib-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }
    .calib-row:last-child { margin-bottom: 0; }
    label { font-size: 13px; color: var(--muted); white-space: nowrap; }
    input[type="number"], select {
      background: #0f172a;
      border: 1px solid #475569;
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 14px;
      width: 90px;
    }
    button, .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:active, .btn:active { opacity: 0.85; }
    button.secondary { background: #475569; }
    button.danger { background: #dc2626; }
    .hint { font-size: 12px; color: #38bdf8; width: 100%; }
    /* ========== 主內容區 ========== */
    #main {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    /* 左側 / 上方影像區 */
    #image-area {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #video, #canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #canvas { display: none; cursor: crosshair; touch-action: none; }
    #overlay-canvas {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
    }
    /* 右側工具列 (PC) */
    #toolbar {
      width: 140px;
      background: var(--panel);
      border-left: 1px solid #334155;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      overflow-y: auto;
    }
    #toolbar button {
      width: 100%;
      text-align: left;
      padding: 10px 8px;
    }
    #toolbar button.active {
      outline: 2px solid #2dd4bf;
      background: #0f766e;
    }
    /* 下方結果區 */
    #result-panel {
      background: var(--panel);
      border-top: 1px solid #334155;
      padding: 10px 14px;
      flex-shrink: 0;
      font-size: 14px;
      min-height: 52px;
    }
    #result-panel .title { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    #result-text { line-height: 1.45; }

    /* ========== 手機版布局 (≤768px) ========== */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      #main {
        flex-direction: column;
      }
      #image-area {
        flex: 1;
        min-height: 0;
      }
      #toolbar {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        border-left: none;
        border-top: 1px solid #334155;
        border-bottom: 1px solid #334155;
        padding: 8px;
        gap: 6px;
      }
      #toolbar button {
        width: auto;
        flex-shrink: 0;
        padding: 10px 14px;
        font-size: 13px;
      }
      #result-panel { font-size: 13px; }
      input[type="number"] { width: 70px; }
    }
  </style>
</head>
<body>
  <!-- 上方校正區 -->
  <div id="calib-panel">
    <div class="calib-row">
      <label>實際尺寸</label>
      <input type="number" id="actual-size" value="10" min="0.01" step="0.01" />
      <select id="unit">
        <option value="mm">mm</option>
        <option value="µm">µm</option>
        <option value="cm">cm</option>
        <option value="inch">inch</option>
      </select>
      <label>尺規模式</label>
      <select id="scale-mode">
        <option value="line">水平/垂直尺規</option>
        <option value="circle">圓形尺規</option>
      </select>
      <button id="btn-toggle-scale" class="secondary">顯示半透明尺規</button>
      <button id="btn-finish-calib">完成校正</button>
      <button id="btn-recapture" class="secondary">重新開啟鏡頭</button>
    </div>
    <div class="hint" id="calib-hint">請先開啟鏡頭，輸入實際尺寸後拖曳半透明尺規與物件重合，再按「完成校正」。</div>
  </div>

  <!-- 主區域 -->
  <div id="main">
    <div id="image-area">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <!-- 用於繪製尺規、綠色區塊、量測結果的覆蓋層 -->
      <canvas id="overlay-canvas"></canvas>
    </div>

    <!-- 工具列 -->
    <div id="toolbar">
      <button id="tool-line" data-tool="line">兩點距離</button>
      <button id="tool-rect" data-tool="rect">矩形</button>
      <button id="tool-circle" data-tool="circle">圓形</button>
      <button id="btn-clear" class="secondary">清除量測</button>
      <button id="btn-recalib" class="secondary">重新校正</button>
      <button id="btn-capture">擷取影像</button>
    </div>
  </div>

  <!-- 下方結果 -->
  <div id="result-panel">
    <div class="title">量測結果（自動邊緣計算，降低人為誤差）</div>
    <div id="result-text">請先完成校正並擷取影像，再使用工具進行量測。</div>
  </div>

  <script>
    // ==================== 全域狀態 ====================
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const octx = overlay.getContext('2d');

    let stream = null;
    let isCaptured = false;
    let pixelsPerUnit = 0;          // 校正後：每單位實際長度對應的像素數
    let currentUnit = 'mm';
    let scaleVisible = false;
    let scaleMode = 'line';         // 'line' | 'circle'
    let currentTool = null;         // 'line' | 'rect' | 'circle' | null

    // 尺規狀態
    let lineScale = { x1: 80, y1: 120, x2: 280, y2: 120 }; // 水平尺規預設
    let circleScale = { cx: 200, cy: 200, r: 80 };
    let dragging = null; // { type: 'line-end1'|'line-end2'|'circle-center'|'circle-radius', ... }

    // 量測狀態
    let measurePoints = [];         // 當前工具的點
    let greenRegion = null;         // 綠色區塊描述
    let lastResult = null;

    // ==================== 初始化鏡頭 ====================
    async function startCamera() {
      // 檢查是否為安全環境（HTTPS 或 localhost）
      const isSecure = window.isSecureContext || location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      
      if (!isSecure) {
        const msg = '目前不是安全環境（非 HTTPS / localhost）。\n\n手機瀏覽器開啟本地 HTML 檔案時，通常無法使用相機。\n\n解決方法：\n1. 把此檔案放到支援 HTTPS 的網頁空間（例如 GitHub Pages、Netlify、Vercel）\n2. 或使用電腦以 localhost 開啟後，再用手機連同一網路存取\n3. 最簡單：用電腦 Chrome 開啟此檔案進行測試';
        alert(msg);
        updateHint('請使用 HTTPS 或 localhost 環境開啟，否則無法存取相機。');
        document.getElementById('result-text').textContent = '相機無法使用：需要 HTTPS 或 localhost 環境。';
        return;
      }

      // 檢查 mediaDevices 支援
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        // 嘗試舊版 API（極少數舊瀏覽器）
        const getUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia;
        if (!getUserMedia) {
          alert('此瀏覽器不支援相機存取（getUserMedia）。\n請改用最新版 Chrome、Safari 或 Edge。');
          updateHint('瀏覽器不支援相機 API。');
          return;
        }
        // 舊版 callback 寫法（很少需要）
        alert('偵測到較舊的瀏覽器 API，建議更新瀏覽器以獲得最佳體驗。');
      }

      try {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
        }

        const constraints = {
          video: {
            facingMode: { ideal: 'environment' },  // 優先後置鏡頭
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.style.display = 'block';
        canvas.style.display = 'none';
        isCaptured = false;
        pixelsPerUnit = 0;
        updateHint('鏡頭已開啟。請輸入實際尺寸，顯示並拖曳半透明尺規與物件重合後按「完成校正」。');
        document.getElementById('result-text').textContent = '請先完成校正並擷取影像。';
        resizeOverlay();
      } catch (err) {
        let msg = '無法開啟鏡頭：' + (err.message || err.name || '未知錯誤');
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          msg += '\n\n請到瀏覽器設定中允許此網站使用相機，然後重新整理頁面。';
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
          msg += '\n\n找不到可用的相機裝置。';
        } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
          msg += '\n\n相機可能被其他應用程式占用，請關閉其他使用相機的 App 後重試。';
        } else {
          msg += '\n\n請確認：\n• 已允許相機權限\n• 使用 HTTPS 或 localhost 開啟\n• 瀏覽器為最新版本';
        }
        alert(msg);
        updateHint('相機開啟失敗，請檢查權限與環境。');
        document.getElementById('result-text').textContent = '相機開啟失敗。';
      }
    }

    // ==================== 尺寸與覆蓋層同步 ====================
    function resizeOverlay() {
      const area = document.getElementById('image-area');
      const rect = area.getBoundingClientRect();
      const w = Math.floor(rect.width);
      const h = Math.floor(rect.height);
      overlay.width = w;
      overlay.height = h;
      overlay.style.width = w + 'px';
      overlay.style.height = h + 'px';
      if (isCaptured) {
        // 保持 canvas 與影像比例
        drawOverlay();
      } else {
        // 預覽時也畫尺規
        drawOverlay();
      }
    }
    window.addEventListener('resize', resizeOverlay);

    // ==================== 繪製覆蓋層（尺規 + 綠色區塊 + 量測標記） ====================
    function drawOverlay() {
      octx.clearRect(0, 0, overlay.width, overlay.height);

      // 1. 半透明尺規
      if (scaleVisible && !isCaptured) {
        octx.save();
        octx.globalAlpha = 0.45;
        octx.strokeStyle = '#22d3ee';
        octx.fillStyle = '#22d3ee';
        octx.lineWidth = 2;
        octx.setLineDash([6, 4]);

        if (scaleMode === 'line') {
          octx.beginPath();
          octx.moveTo(lineScale.x1, lineScale.y1);
          octx.lineTo(lineScale.x2, lineScale.y2);
          octx.stroke();
          // 兩端控制點
          drawHandle(lineScale.x1, lineScale.y1);
          drawHandle(lineScale.x2, lineScale.y2);
          // 刻度示意
          const dx = lineScale.x2 - lineScale.x1;
          const dy = lineScale.y2 - lineScale.y1;
          const len = Math.hypot(dx, dy) || 1;
          const ux = dx / len, uy = dy / len;
          for (let i = 0; i <= 10; i++) {
            const t = i / 10;
            const px = lineScale.x1 + dx * t;
            const py = lineScale.y1 + dy * t;
            octx.beginPath();
            octx.moveTo(px - uy * 8, py + ux * 8);
            octx.lineTo(px + uy * 8, py - ux * 8);
            octx.stroke();
          }
        } else {
          // 圓形尺規
          octx.beginPath();
          octx.arc(circleScale.cx, circleScale.cy, circleScale.r, 0, Math.PI * 2);
          octx.stroke();
          // 十字中心
          octx.beginPath();
          octx.moveTo(circleScale.cx - 10, circleScale.cy);
          octx.lineTo(circleScale.cx + 10, circleScale.cy);
          octx.moveTo(circleScale.cx, circleScale.cy - 10);
          octx.lineTo(circleScale.cx, circleScale.cy + 10);
          octx.stroke();
          drawHandle(circleScale.cx, circleScale.cy);
          // 半徑控制點
          drawHandle(circleScale.cx + circleScale.r, circleScale.cy);
        }
        octx.restore();
      }

      // 2. 綠色半透明區塊（量測時）
      if (greenRegion && isCaptured) {
        octx.save();
        octx.fillStyle = 'rgba(34, 197, 94, 0.28)';
        octx.strokeStyle = 'rgba(34, 197, 94, 0.9)';
        octx.lineWidth = 2;
        octx.setLineDash([]);

        if (greenRegion.type === 'band') {
          // 帶狀（兩點距離）
          drawBand(greenRegion.x1, greenRegion.y1, greenRegion.x2, greenRegion.y2, greenRegion.width);
        } else if (greenRegion.type === 'rect') {
          octx.fillRect(greenRegion.x, greenRegion.y, greenRegion.w, greenRegion.h);
          octx.strokeRect(greenRegion.x, greenRegion.y, greenRegion.w, greenRegion.h);
        } else if (greenRegion.type === 'circle') {
          octx.beginPath();
          octx.arc(greenRegion.cx, greenRegion.cy, greenRegion.r + greenRegion.expand, 0, Math.PI * 2);
          octx.arc(greenRegion.cx, greenRegion.cy, Math.max(0, greenRegion.r - greenRegion.expand), 0, Math.PI * 2, true);
          octx.fill('evenodd');
          octx.beginPath();
          octx.arc(greenRegion.cx, greenRegion.cy, greenRegion.r + greenRegion.expand, 0, Math.PI * 2);
          octx.stroke();
        }
        octx.restore();
      }

      // 3. 量測標記與自動邊緣點
      if (lastResult && isCaptured) {
        octx.save();
        octx.strokeStyle = '#f472b6';
        octx.fillStyle = '#f472b6';
        octx.lineWidth = 2;
        octx.setLineDash([]);

        if (lastResult.tool === 'line' && lastResult.autoStart && lastResult.autoEnd) {
          octx.beginPath();
          octx.moveTo(lastResult.autoStart.x, lastResult.autoStart.y);
          octx.lineTo(lastResult.autoEnd.x, lastResult.autoEnd.y);
          octx.stroke();
          drawCross(lastResult.autoStart.x, lastResult.autoStart.y);
          drawCross(lastResult.autoEnd.x, lastResult.autoEnd.y);
        } else if (lastResult.tool === 'rect' && lastResult.outer) {
          const r = lastResult.outer;
          octx.strokeRect(r.x, r.y, r.w, r.h);
          if (lastResult.inner) {
            const i = lastResult.inner;
            octx.setLineDash([4, 3]);
            octx.strokeRect(i.x, i.y, i.w, i.h);
          }
        } else if (lastResult.tool === 'circle') {
          if (lastResult.outerR) {
            octx.beginPath();
            octx.arc(lastResult.cx, lastResult.cy, lastResult.outerR, 0, Math.PI * 2);
            octx.stroke();
          }
          if (lastResult.innerR) {
            octx.setLineDash([4, 3]);
            octx.beginPath();
            octx.arc(lastResult.cx, lastResult.cy, lastResult.innerR, 0, Math.PI * 2);
            octx.stroke();
          }
          drawCross(lastResult.cx, lastResult.cy);
        }
        octx.restore();
      }

      // 4. 當前正在畫的臨時圖形
      if (measurePoints.length > 0 && currentTool) {
        octx.save();
        octx.strokeStyle = '#a78bfa';
        octx.lineWidth = 1.5;
        octx.setLineDash([4, 3]);
        if (currentTool === 'line' && measurePoints.length === 1) {
          // 等第二點
        } else if (currentTool === 'line' && measurePoints.length === 2) {
          octx.beginPath();
          octx.moveTo(measurePoints[0].x, measurePoints[0].y);
          octx.lineTo(measurePoints[1].x, measurePoints[1].y);
          octx.stroke();
        } else if (currentTool === 'rect' && measurePoints.length === 2) {
          const x = Math.min(measurePoints[0].x, measurePoints[1].x);
          const y = Math.min(measurePoints[0].y, measurePoints[1].y);
          const w = Math.abs(measurePoints[1].x - measurePoints[0].x);
          const h = Math.abs(measurePoints[1].y - measurePoints[0].y);
          octx.strokeRect(x, y, w, h);
        } else if (currentTool === 'circle' && measurePoints.length === 2) {
          const r = Math.hypot(measurePoints[1].x - measurePoints[0].x, measurePoints[1].y - measurePoints[0].y);
          octx.beginPath();
          octx.arc(measurePoints[0].x, measurePoints[0].y, r, 0, Math.PI * 2);
          octx.stroke();
        }
        octx.restore();
      }
    }

    function drawHandle(x, y) {
      octx.beginPath();
      octx.arc(x, y, 9, 0, Math.PI * 2);
      octx.fill();
      octx.strokeStyle = '#fff';
      octx.lineWidth = 1.5;
      octx.stroke();
    }
    function drawCross(x, y) {
      octx.beginPath();
      octx.moveTo(x - 7, y); octx.lineTo(x + 7, y);
      octx.moveTo(x, y - 7); octx.lineTo(x, y + 7);
      octx.stroke();
    }
    function drawBand(x1, y1, x2, y2, width) {
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const ux = -dy / len * width, uy = dx / len * width;
      octx.beginPath();
      octx.moveTo(x1 + ux, y1 + uy);
      octx.lineTo(x2 + ux, y2 + uy);
      octx.lineTo(x2 - ux, y2 - uy);
      octx.lineTo(x1 - ux, y1 - uy);
      octx.closePath();
      octx.fill();
      octx.stroke();
    }

    // ==================== 校正完成 ====================
    function finishCalibration() {
      const actual = parseFloat(document.getElementById('actual-size').value);
      if (!actual || actual <= 0) {
        alert('請輸入有效的實際尺寸');
        return;
      }
      currentUnit = document.getElementById('unit').value;
      let pixelLen = 0;
      if (scaleMode === 'line') {
        pixelLen = Math.hypot(lineScale.x2 - lineScale.x1, lineScale.y2 - lineScale.y1);
      } else {
        pixelLen = circleScale.r * 2; // 使用直徑
      }
      if (pixelLen < 5) {
        alert('尺規太小，請拉大後再校正');
        return;
      }
      pixelsPerUnit = pixelLen / actual;
      scaleVisible = false;
      document.getElementById('btn-toggle-scale').textContent = '顯示半透明尺規';
      updateHint(`校正完成！比例 = ${pixelsPerUnit.toFixed(2)} px / ${currentUnit}。請按「擷取影像」後開始量測。`);
      drawOverlay();
    }

    // ==================== 擷取影像 ====================
    function captureImage() {
      if (!stream) {
        alert('請先開啟鏡頭');
        return;
      }
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) {
        alert('鏡頭尚未就緒，請稍候再試');
        return;
      }
      // 將 video 畫到 canvas，保持比例並置中於 overlay 尺寸
      const area = document.getElementById('image-area');
      const rect = area.getBoundingClientRect();
      const areaW = rect.width;
      const areaH = rect.height;
      const scale = Math.min(areaW / vw, areaH / vh);
      const drawW = vw * scale;
      const drawH = vh * scale;
      const offsetX = (areaW - drawW) / 2;
      const offsetY = (areaH - drawH) / 2;

      canvas.width = areaW;
      canvas.height = areaH;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, areaW, areaH);
      ctx.drawImage(video, offsetX, offsetY, drawW, drawH);

      video.style.display = 'none';
      canvas.style.display = 'block';
      isCaptured = true;
      measurePoints = [];
      greenRegion = null;
      lastResult = null;
      updateHint('影像已擷取。請選擇工具，在影像上粗略操作，系統會以綠色區塊自動偵測邊緣並計算尺寸。');
      document.getElementById('result-text').textContent = '請選擇量測工具並在影像上操作。';
      drawOverlay();
    }

    // ==================== 簡易邊緣偵測（純 JS，降低人為誤差） ====================
    // 在指定區域內找梯度最強的點
    function getImageDataSafe() {
      try {
        return ctx.getImageData(0, 0, canvas.width, canvas.height);
      } catch (e) {
        return null;
      }
    }

    function gradientAt(imgData, x, y) {
      const w = imgData.width, h = imgData.height;
      x = Math.max(1, Math.min(w - 2, Math.round(x)));
      y = Math.max(1, Math.min(h - 2, Math.round(y)));
      const idx = (y * w + x) * 4;
      const data = imgData.data;
      // 簡單 Sobel 近似（灰階）
      const gray = (i) => 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
      const tl = gray(idx - w*4 - 4), tc = gray(idx - w*4), tr = gray(idx - w*4 + 4);
      const ml = gray(idx - 4),           mr = gray(idx + 4);
      const bl = gray(idx + w*4 - 4), bc = gray(idx + w*4), br = gray(idx + w*4 + 4);
      const gx = -tl + tr - 2*ml + 2*mr - bl + br;
      const gy = -tl - 2*tc - tr + bl + 2*bc + br;
      return Math.abs(gx) + Math.abs(gy);
    }

    // 兩點距離：在帶狀區域兩端找最強邊緣點
    function autoEdgeLine(x1, y1, x2, y2, bandWidth) {
      const imgData = getImageDataSafe();
      if (!imgData) return { start: {x:x1,y:y1}, end: {x:x2,y:y2} };

      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const px = -uy, py = ux; // 垂直方向

      function findStrongestNear(cx, cy, searchRadius) {
        let best = { x: cx, y: cy, g: -1 };
        for (let r = 0; r <= searchRadius; r += 1) {
          for (let a = 0; a < 16; a++) {
            const ang = (a / 16) * Math.PI * 2;
            const sx = cx + Math.cos(ang) * r;
            const sy = cy + Math.sin(ang) * r;
            // 限制在帶狀內
            const proj = ((sx - x1) * ux + (sy - y1) * uy);
            if (proj < -5 || proj > len + 5) continue;
            const distToLine = Math.abs((sx - x1) * px + (sy - y1) * py);
            if (distToLine > bandWidth) continue;
            const g = gradientAt(imgData, sx, sy);
            if (g > best.g) best = { x: sx, y: sy, g };
          }
        }
        return best;
      }

      const searchR = Math.max(bandWidth, 18);
      const start = findStrongestNear(x1, y1, searchR);
      const end   = findStrongestNear(x2, y2, searchR);
      return { start: { x: start.x, y: start.y }, end: { x: end.x, y: end.y } };
    }

    // 矩形：在四邊擴張區域找強邊緣，嘗試偵測內外
    function autoEdgeRect(rx, ry, rw, rh, expand) {
      const imgData = getImageDataSafe();
      if (!imgData) {
        return { outer: { x: rx, y: ry, w: rw, h: rh }, inner: null };
      }

      // 簡化：對每條邊取中點附近最強梯度位置，微調邊界
      function sampleEdge(x0, y0, x1, y1, outwardX, outwardY) {
        const samples = [];
        const steps = 12;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const bx = x0 + (x1 - x0) * t;
          const by = y0 + (y1 - y0) * t;
          let bestG = -1, bestD = 0;
          for (let d = -expand; d <= expand; d++) {
            const sx = bx + outwardX * d;
            const sy = by + outwardY * d;
            const g = gradientAt(imgData, sx, sy);
            if (g > bestG) { bestG = g; bestD = d; }
          }
          samples.push(bestD);
        }
        // 取中位數
        samples.sort((a,b)=>a-b);
        return samples[Math.floor(samples.length/2)];
      }

      const leftD  = sampleEdge(rx, ry, rx, ry+rh, -1, 0);
      const rightD = sampleEdge(rx+rw, ry, rx+rw, ry+rh, 1, 0);
      const topD   = sampleEdge(rx, ry, rx+rw, ry, 0, -1);
      const botD   = sampleEdge(rx, ry+rh, rx+rw, ry+rh, 0, 1);

      const outer = {
        x: rx + leftD,
        y: ry + topD,
        w: rw + (rightD - leftD),
        h: rh + (botD - topD)
      };

      // 嘗試找內框：在更內側再搜一次（簡化版，實際可再優化）
      let inner = null;
      if (rw > 30 && rh > 30) {
        const inset = Math.min(rw, rh) * 0.15;
        const ix = rx + inset, iy = ry + inset, iw = rw - inset*2, ih = rh - inset*2;
        const iLeft  = sampleEdge(ix, iy, ix, iy+ih, -1, 0);
        const iRight = sampleEdge(ix+iw, iy, ix+iw, iy+ih, 1, 0);
        const iTop   = sampleEdge(ix, iy, ix+iw, iy, 0, -1);
        const iBot   = sampleEdge(ix, iy+ih, ix+iw, iy+ih, 0, 1);
        inner = {
          x: ix + iLeft,
          y: iy + iTop,
          w: iw + (iRight - iLeft),
          h: ih + (iBot - iTop)
        };
        // 若內外差異太小則忽略內框
        if (Math.abs(inner.w - outer.w) < 4 && Math.abs(inner.h - outer.h) < 4) {
          inner = null;
        }
      }
      return { outer, inner };
    }

    // 圓形：在環狀區域找內外半徑
    function autoEdgeCircle(cx, cy, r, expand) {
      const imgData = getImageDataSafe();
      if (!imgData) return { cx, cy, outerR: r, innerR: null };

      const angles = 36;
      const outerSamples = [];
      const innerSamples = [];

      for (let i = 0; i < angles; i++) {
        const ang = (i / angles) * Math.PI * 2;
        const cos = Math.cos(ang), sin = Math.sin(ang);
        let bestOuter = r, bestG = -1;
        let bestInner = r * 0.6, bestIG = -1;

        for (let d = -expand; d <= expand; d++) {
          const rad = r + d;
          if (rad < 3) continue;
          const sx = cx + cos * rad;
          const sy = cy + sin * rad;
          const g = gradientAt(imgData, sx, sy);
          if (g > bestG) { bestG = g; bestOuter = rad; }
        }
        // 內側再搜一輪
        for (let d = 3; d < r * 0.7; d++) {
          const rad = r - d;
          if (rad < 3) break;
          const sx = cx + cos * rad;
          const sy = cy + sin * rad;
          const g = gradientAt(imgData, sx, sy);
          if (g > bestIG) { bestIG = g; bestInner = rad; }
        }
        outerSamples.push(bestOuter);
        if (bestIG > 30) innerSamples.push(bestInner);
      }

      outerSamples.sort((a,b)=>a-b);
      const outerR = outerSamples[Math.floor(outerSamples.length/2)];

      let innerR = null;
      if (innerSamples.length > angles * 0.4) {
        innerSamples.sort((a,b)=>a-b);
        innerR = innerSamples[Math.floor(innerSamples.length/2)];
        if (Math.abs(outerR - innerR) < 5) innerR = null;
      }
      return { cx, cy, outerR, innerR };
    }

    // ==================== 執行量測（綠色區塊 + 自動邊緣） ====================
    function performMeasure() {
      if (!isCaptured || pixelsPerUnit <= 0) {
        alert('請先完成校正並擷取影像');
        return;
      }
      if (measurePoints.length < 2) return;

      const p0 = measurePoints[0];
      const p1 = measurePoints[1];
      const bandW = 14; // 綠色半寬

      if (currentTool === 'line') {
        greenRegion = { type: 'band', x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y, width: bandW };
        const edges = autoEdgeLine(p0.x, p0.y, p1.x, p1.y, bandW);
        const pixelDist = Math.hypot(edges.end.x - edges.start.x, edges.end.y - edges.start.y);
        const real = pixelDist / pixelsPerUnit;
        lastResult = {
          tool: 'line',
          autoStart: edges.start,
          autoEnd: edges.end,
          pixel: pixelDist,
          real: real
        };
        document.getElementById('result-text').innerHTML =
          `兩點距離（自動邊緣）<br>` +
          `像素距離：${pixelDist.toFixed(1)} px<br>` +
          `<strong>實際尺寸：${real.toFixed(3)} ${currentUnit}</strong>`;
      }
      else if (currentTool === 'rect') {
        const x = Math.min(p0.x, p1.x);
        const y = Math.min(p0.y, p1.y);
        const w = Math.abs(p1.x - p0.x);
        const h = Math.abs(p1.y - p0.y);
        const expand = 12;
        greenRegion = { type: 'rect', x: x - expand, y: y - expand, w: w + expand*2, h: h + expand*2 };
        const edges = autoEdgeRect(x, y, w, h, expand);
        lastResult = { tool: 'rect', ...edges };

        const ow = edges.outer.w / pixelsPerUnit;
        const oh = edges.outer.h / pixelsPerUnit;
        let html = `矩形（自動邊緣）<br>外框：${ow.toFixed(3)} × ${oh.toFixed(3)} ${currentUnit}`;
        if (edges.inner) {
          const iw = edges.inner.w / pixelsPerUnit;
          const ih = edges.inner.h / pixelsPerUnit;
          const thickW = (edges.outer.w - edges.inner.w) / 2 / pixelsPerUnit;
          const thickH = (edges.outer.h - edges.inner.h) / 2 / pixelsPerUnit;
          html += `<br>內框：${iw.toFixed(3)} × ${ih.toFixed(3)} ${currentUnit}`;
          html += `<br>壁厚（約）：水平 ${thickW.toFixed(3)} / 垂直 ${thickH.toFixed(3)} ${currentUnit}`;
        }
        document.getElementById('result-text').innerHTML = html;
      }
      else if (currentTool === 'circle') {
        const r = Math.hypot(p1.x - p0.x, p1.y - p0.y);
        const expand = 14;
        greenRegion = { type: 'circle', cx: p0.x, cy: p0.y, r: r, expand: expand };
        const edges = autoEdgeCircle(p0.x, p0.y, r, expand);
        lastResult = { tool: 'circle', ...edges };

        const outerD = (edges.outerR * 2) / pixelsPerUnit;
        let html = `圓形（自動邊緣）<br>外圓直徑：${outerD.toFixed(3)} ${currentUnit}`;
        if (edges.innerR) {
          const innerD = (edges.innerR * 2) / pixelsPerUnit;
          const thick = (edges.outerR - edges.innerR) / pixelsPerUnit;
          html += `<br>內圓直徑：${innerD.toFixed(3)} ${currentUnit}`;
          html += `<br>壁厚：${thick.toFixed(3)} ${currentUnit}`;
        }
        document.getElementById('result-text').innerHTML = html;
      }
      drawOverlay();
    }

    // ==================== 事件處理 ====================
    function getPos(e) {
      const rect = overlay.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // 尺規拖曳
    function onPointerDown(e) {
      if (!scaleVisible || isCaptured) {
        // 量測模式
        if (!isCaptured || !currentTool || pixelsPerUnit <= 0) return;
        e.preventDefault();
        const pos = getPos(e);
        if (measurePoints.length >= 2) measurePoints = [];
        measurePoints.push(pos);
        if (measurePoints.length === 2) {
          performMeasure();
        } else {
          greenRegion = null;
          lastResult = null;
          drawOverlay();
        }
        return;
      }

      // 校正模式拖曳
      e.preventDefault();
      const pos = getPos(e);
      const hitR = 18;
      if (scaleMode === 'line') {
        if (Math.hypot(pos.x - lineScale.x1, pos.y - lineScale.y1) < hitR) dragging = { type: 'line-end1' };
        else if (Math.hypot(pos.x - lineScale.x2, pos.y - lineScale.y2) < hitR) dragging = { type: 'line-end2' };
        else {
          // 檢查是否點在線上，整體移動
          const d = pointToSegmentDist(pos, lineScale.x1, lineScale.y1, lineScale.x2, lineScale.y2);
          if (d < 12) dragging = { type: 'line-move', ox: pos.x, oy: pos.y, lx1: lineScale.x1, ly1: lineScale.y1, lx2: lineScale.x2, ly2: lineScale.y2 };
        }
      } else {
        if (Math.hypot(pos.x - circleScale.cx, pos.y - circleScale.cy) < hitR) dragging = { type: 'circle-center' };
        else if (Math.hypot(pos.x - (circleScale.cx + circleScale.r), pos.y - circleScale.cy) < hitR) dragging = { type: 'circle-radius' };
        else if (Math.abs(Math.hypot(pos.x - circleScale.cx, pos.y - circleScale.cy) - circleScale.r) < 12) {
          dragging = { type: 'circle-radius' };
        }
      }
    }

    function onPointerMove(e) {
      if (!dragging) return;
      e.preventDefault();
      const pos = getPos(e);
      if (dragging.type === 'line-end1') {
        lineScale.x1 = pos.x; lineScale.y1 = pos.y;
      } else if (dragging.type === 'line-end2') {
        lineScale.x2 = pos.x; lineScale.y2 = pos.y;
      } else if (dragging.type === 'line-move') {
        const dx = pos.x - dragging.ox, dy = pos.y - dragging.oy;
        lineScale.x1 = dragging.lx1 + dx; lineScale.y1 = dragging.ly1 + dy;
        lineScale.x2 = dragging.lx2 + dx; lineScale.y2 = dragging.ly2 + dy;
      } else if (dragging.type === 'circle-center') {
        circleScale.cx = pos.x; circleScale.cy = pos.y;
      } else if (dragging.type === 'circle-radius') {
        circleScale.r = Math.max(10, Math.hypot(pos.x - circleScale.cx, pos.y - circleScale.cy));
      }
      drawOverlay();
    }

    function onPointerUp() { dragging = null; }

    function pointToSegmentDist(p, x1, y1, x2, y2) {
      const dx = x2 - x1, dy = y2 - y1;
      const len2 = dx*dx + dy*dy || 1;
      let t = ((p.x - x1)*dx + (p.y - y1)*dy) / len2;
      t = Math.max(0, Math.min(1, t));
      const px = x1 + t*dx, py = y1 + t*dy;
      return Math.hypot(p.x - px, p.y - py);
    }

    // 綁定事件
    overlay.style.pointerEvents = 'auto';
    overlay.addEventListener('mousedown', onPointerDown);
    overlay.addEventListener('mousemove', onPointerMove);
    overlay.addEventListener('mouseup', onPointerUp);
    overlay.addEventListener('mouseleave', onPointerUp);
    overlay.addEventListener('touchstart', onPointerDown, { passive: false });
    overlay.addEventListener('touchmove', onPointerMove, { passive: false });
    overlay.addEventListener('touchend', onPointerUp);

    // 按鈕事件
    document.getElementById('btn-toggle-scale').addEventListener('click', () => {
      scaleVisible = !scaleVisible;
      document.getElementById('btn-toggle-scale').textContent = scaleVisible ? '隱藏半透明尺規' : '顯示半透明尺規';
      drawOverlay();
    });
    document.getElementById('btn-finish-calib').addEventListener('click', finishCalibration);
    document.getElementById('btn-recapture').addEventListener('click', () => {
      startCamera();
      scaleVisible = false;
      document.getElementById('btn-toggle-scale').textContent = '顯示半透明尺規';
    });
    document.getElementById('btn-capture').addEventListener('click', captureImage);
    document.getElementById('btn-clear').addEventListener('click', () => {
      measurePoints = [];
      greenRegion = null;
      lastResult = null;
      document.getElementById('result-text').textContent = '已清除量測。';
      drawOverlay();
    });
    document.getElementById('btn-recalib').addEventListener('click', () => {
      isCaptured = false;
      video.style.display = 'block';
      canvas.style.display = 'none';
      pixelsPerUnit = 0;
      scaleVisible = true;
      document.getElementById('btn-toggle-scale').textContent = '隱藏半透明尺規';
      measurePoints = [];
      greenRegion = null;
      lastResult = null;
      updateHint('已回到校正模式。請重新拖曳尺規重合後按「完成校正」。');
      drawOverlay();
    });

    document.getElementById('scale-mode').addEventListener('change', (e) => {
      scaleMode = e.target.value;
      drawOverlay();
    });

    // 工具選擇
    document.querySelectorAll('#toolbar [data-tool]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#toolbar [data-tool]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
        measurePoints = [];
        greenRegion = null;
        lastResult = null;
        drawOverlay();
        updateHint(`已選擇「${btn.textContent}」工具。在影像上點選兩點（或拖曳）進行粗略選取，系統會顯示綠色區塊並自動計算邊緣。`);
      });
    });

    function updateHint(msg) {
      document.getElementById('calib-hint').textContent = msg;
    }

    // 啟動
    startCamera();
    setTimeout(resizeOverlay, 300);
    setTimeout(resizeOverlay, 1000);
  </script>
</body>
</html>
