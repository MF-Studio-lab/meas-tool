<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>影像尺寸測量工具（校正 + 自動邊緣）</title>
  <style>
    :root {
      --primary: #0d9488;
      --green: rgba(34, 197, 94, 0.28);
      --green-border: rgba(34, 197, 94, 0.85);
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* ========== 上方校正區 ========== */
    #calib-panel {
      background: var(--panel);
      padding: 8px 12px;
      border-bottom: 1px solid #334155;
      flex: 0 0 auto;
      flex-shrink: 0;
      z-index: 20;
      max-height: 42vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .calib-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }
    .calib-row:last-child { margin-bottom: 0; }
    label { font-size: 13px; color: var(--muted); white-space: nowrap; }
    input[type="number"], select {
      background: #0f172a;
      border: 1px solid #475569;
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 14px;
      width: 90px;
    }
    button, .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:active, .btn:active { opacity: 0.85; }
    button.secondary { background: #475569; }
    button.danger { background: #dc2626; }
    .hint { font-size: 12px; color: #38bdf8; width: 100%; }
    /* ========== 主內容區 ========== */
    #main {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    #viewport-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    /* 左側 / 上方影像區 */
    #image-area {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 0;
    }
    #video, #canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #canvas { display: none; cursor: crosshair; touch-action: none; }
    #overlay-canvas {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
    }
    /* 右側工具列 (PC) */
    #toolbar {
      width: 140px;
      background: var(--panel);
      border-left: 1px solid #334155;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      overflow-y: auto;
    }
    #toolbar button {
      width: 100%;
      text-align: left;
      padding: 10px 8px;
    }
    #toolbar button.active {
      outline: 2px solid #2dd4bf;
      background: #0f766e;
    }
    /* 下方結果區：固定高度，內容再多也只在內部捲動，绝不改變影像區尺寸 */
    #result-panel {
      background: var(--panel);
      border-top: 1px solid #334155;
      padding: 6px 12px;
      flex: 0 0 128px;
      height: 128px;
      min-height: 128px;
      max-height: 128px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      font-size: 14px;
    }
    #result-panel .title { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
    #result-text { line-height: 1.4; }
    #edge-gain-row { display: none; }
    /* 影像舞台（數位縮放／平移） */
    #image-stage {
      position: relative;
      transform-origin: center center;
      will-change: transform;
    }
    #view-zoom-bar {
      display: none;
      position: absolute;
      right: 8px;
      bottom: 8px;
      z-index: 15;
      gap: 4px;
      align-items: center;
      background: rgba(15, 23, 42, 0.75);
      padding: 4px 6px;
      border-radius: 8px;
    }
    #view-zoom-bar button { padding: 6px 10px; font-size: 12px; }
    /* 相機控制列：放在影像下方，隱藏時不影響影像區位置 */
    #camera-controls-bar {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: var(--panel);
      border-top: 1px solid #334155;
      padding: 6px 10px;
      flex: 0 0 auto;
    }

    /* ========== 手機版布局 (≤768px) ========== */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      #main {
        flex: 1 1 0;
        min-height: 0;
        flex-direction: column;
      }
      #viewport-col {
        flex: 1 1 0;
        min-height: 0;
      }
      #image-area {
        flex: 1 1 0;
        min-height: 0;
      }
      /* 擷取後 canvas 以容器為基準，避免結果列變高造成縮放位移 */
      #canvas, #video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #toolbar {
        width: 100%;
        flex: 0 0 auto;
        flex-direction: row;
        overflow-x: auto;
        border-left: none;
        border-top: 1px solid #334155;
        border-bottom: 1px solid #334155;
        padding: 8px;
        gap: 6px;
      }
      #toolbar button {
        width: auto;
        flex-shrink: 0;
        padding: 10px 14px;
        font-size: 13px;
      }
      /* 手機結果區：固定高度，不因文字多寡改變 */
      #result-panel {
        font-size: 13px;
        flex: 0 0 120px;
        height: 120px;
        min-height: 120px;
        max-height: 120px;
      }
      input[type="number"] { width: 70px; }
      #camera-controls-bar { font-size: 12px; }
    }
  </style>
</head>
<body>
  <!-- 上方校正區 -->
  <div id="calib-panel">
    <div class="calib-row">
      <label>實際尺寸</label>
      <input type="number" id="actual-size" value="10" min="0.01" step="0.01" />
      <select id="unit">
        <option value="mm">mm</option>
        <option value="µm">µm</option>
        <option value="cm">cm</option>
        <option value="inch">inch</option>
      </select>
      <label>尺規模式</label>
      <select id="scale-mode">
        <option value="line">水平/垂直尺規</option>
        <option value="circle">圓形尺規</option>
      </select>
      <button id="btn-toggle-scale" class="secondary">顯示半透明尺規</button>
      <button id="btn-finish-calib">完成校正</button>
      <button id="btn-recapture" class="secondary">重新開啟鏡頭</button>
    </div>
    <div class="calib-row" id="level-row" style="display:none; align-items:center; gap:10px;">
      <label>水平儀</label>
      <div id="level-indicator" style="display:flex; align-items:center; gap:8px; font-size:13px;">
        <span id="level-text" style="min-width:110px; color:#94a3b8;">等待感測器…</span>
        <div id="level-bar" style="width:80px; height:10px; background:#334155; border-radius:5px; position:relative; overflow:hidden;">
          <div id="level-bubble" style="position:absolute; top:1px; left:35px; width:10px; height:8px; background:#22c55e; border-radius:50%; transition:left 0.1s;"></div>
        </div>
        <span id="level-warn" style="color:#f87171; font-size:12px; display:none;">請保持水平</span>
      </div>
    </div>
    <div class="hint" id="calib-hint">建議流程（自動邊緣校正）：開啟鏡頭 → 按「擷取影像」→ 選「兩點距離」在已知尺寸物件上點選起點與終點（會出現綠色區塊並自動對邊）→ 輸入實際尺寸 → 按「完成校正」。半透明尺規為手動備援，不會產生綠色區塊。</div>
  </div>

  <!-- 主區域 -->
  <div id="main">
    <div id="viewport-col">
      <div id="image-area">
        <div id="image-stage">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="canvas"></canvas>
          <canvas id="overlay-canvas"></canvas>
        </div>
        <!-- 擷取／載入後的數位縮放 -->
        <div id="view-zoom-bar">
          <button type="button" id="btn-view-zoom-out" class="secondary" title="縮小">−</button>
          <span id="view-zoom-label" style="font-size:12px; color:#94a3b8; min-width:36px; text-align:center;">1.0x</span>
          <button type="button" id="btn-view-zoom-in" class="secondary" title="放大">＋</button>
          <button type="button" id="btn-view-zoom-reset" class="secondary" title="重設">重設</button>
        </div>
      </div>

      <!-- 相機控制列：影像下方，關閉／隱藏不影響影像區位置 -->
      <div id="camera-controls-bar">
        <label id="zoom-label" style="display:none;">變焦</label>
        <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" style="display:none; width:100px;" />
        <span id="zoom-value" style="display:none; font-size:12px; color:#94a3b8;">1.0x</span>
        <button id="btn-torch" class="secondary" style="display:none;">開啟補光</button>
        <label id="focus-label" style="display:none;">對焦</label>
        <select id="focus-mode" style="display:none; background:#0f172a; border:1px solid #475569; color:#f1f5f9; padding:4px 6px; border-radius:6px; font-size:12px;"></select>
        <input type="range" id="focus-slider" min="0" max="1" step="0.01" value="0.5" style="display:none; width:90px;" />
        <label id="iso-label" style="display:none;">ISO</label>
        <input type="range" id="iso-slider" min="100" max="800" step="10" value="100" style="display:none; width:90px;" />
        <span id="iso-value" style="display:none; font-size:12px; color:#94a3b8;">—</span>
        <label id="ev-label" style="display:none;">曝光</label>
        <input type="range" id="ev-slider" min="-2" max="2" step="0.1" value="0" style="display:none; width:90px;" />
        <span id="ev-value" style="display:none; font-size:12px; color:#94a3b8;">0</span>
        <span id="cam-capability-hint" style="font-size:11px; color:#64748b;"></span>
      </div>
    </div>

    <!-- 工具列 -->
    <div id="toolbar">
      <button id="tool-line" data-tool="line">兩點距離</button>
      <button id="tool-rect" data-tool="rect">矩形</button>
      <button id="tool-circle" data-tool="circle">圓形</button>
      <button id="btn-clear" class="secondary">清除量測</button>
      <button id="btn-recapture-measure" class="secondary">重新擷取</button>
      <button id="btn-recalib" class="secondary">重新校正</button>
      <button id="btn-load-image" class="secondary">載入影像</button>
      <input type="file" id="file-image-input" accept="image/*" style="display:none;" />
      <button id="btn-capture">擷取影像</button>
    </div>
  </div>

  <!-- 下方結果（固定高度上限，多行在內部捲動，不擠壓影像） -->
  <div id="result-panel">
    <div class="title">量測結果（自動邊緣計算，降低人為誤差）</div>
    <div id="result-text">請先完成校正並擷取影像，再使用工具進行量測。</div>
    <!-- 邊緣增益與圓心微調（結果區內，避免擠壓影像） -->
    <div id="edge-gain-row" style="display:none; align-items:center; gap:8px; flex-wrap:wrap; margin-top:6px; padding-top:6px; border-top:1px solid #334155;">
      <label style="font-size:12px;" title="調低可過濾雜訊、讓準心卡在強邊緣；調高則更靈敏但易受雜訊影響">邊緣增益</label>
      <input type="range" id="edge-gain" min="0.3" max="3.0" step="0.1" value="1.0" style="width:100px; accent-color:#0d9488;" />
      <span id="edge-gain-value" style="font-size:12px; min-width:28px; color:#2dd4bf;">1.0</span>
      <button id="btn-recalc-edge" class="secondary" style="padding:4px 8px; font-size:11px;">重算邊緣</button>
      <span id="center-nudge-wrap" style="display:none; align-items:center; gap:4px; margin-left:4px; flex-wrap:wrap;">
        <span style="font-size:11px; color:#94a3b8;">圓心</span>
        <button type="button" class="secondary center-nudge" data-dx="0" data-dy="-1" style="padding:4px 8px; font-size:12px;" title="上移 1px（不重算）">↑</button>
        <button type="button" class="secondary center-nudge" data-dx="0" data-dy="1" style="padding:4px 8px; font-size:12px;" title="下移 1px（不重算）">↓</button>
        <button type="button" class="secondary center-nudge" data-dx="-1" data-dy="0" style="padding:4px 8px; font-size:12px;" title="左移 1px（不重算）">←</button>
        <button type="button" class="secondary center-nudge" data-dx="1" data-dy="0" style="padding:4px 8px; font-size:12px;" title="右移 1px（不重算）">→</button>
        <span style="font-size:11px; color:#94a3b8; margin-left:4px;">外徑</span>
        <button type="button" class="secondary radius-nudge" data-dr="-0.1" style="padding:4px 8px; font-size:12px;" title="外徑 −0.1 px（亞像素）">−</button>
        <span id="radius-px-label" style="font-size:12px; color:#2dd4bf; min-width:56px;">— px</span>
        <button type="button" class="secondary radius-nudge" data-dr="0.1" style="padding:4px 8px; font-size:12px;" title="外徑 +0.1 px（亞像素）">＋</button>
        <button type="button" id="btn-refine-circle" class="secondary" style="padding:4px 8px; font-size:11px;" title="依目前圓心重算邊緣">依圓心重算</button>
        <span style="font-size:10px; color:#64748b;">拖＋移圓心／拖粉紅圈調外徑</span>
      </span>
    </div>
  </div>

  <script>
    // ==================== 全域狀態 ====================
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const octx = overlay.getContext('2d');

    let stream = null;
    let videoTrack = null;          // 目前的 video track，用來套用 zoom / torch
    let isCaptured = false;
    let pixelsPerUnit = 0;          // 校正後：每單位實際長度對應的像素數
    let currentUnit = 'mm';
    let scaleVisible = false;
    let scaleMode = 'line';         // 'line' | 'circle'
    let currentTool = null;         // 'line' | 'rect' | 'circle' | null
    let torchOn = false;
    let savedZoom = 1;              // 重新擷取時保留的變焦倍率
    let savedTorch = false;         // 重新擷取時是否重開補光
    // 擷取／載入後的數位檢視縮放（與相機光學變焦無關）
    let viewZoom = 1;
    let viewPanX = 0;
    let viewPanY = 0;
    let viewPanning = null; // { x0, y0, panX0, panY0 }

    // 尺規狀態
    let lineScale = { x1: 80, y1: 120, x2: 280, y2: 120 }; // 水平尺規預設
    let circleScale = { cx: 200, cy: 200, r: 80 };
    let dragging = null; // { type: 'line-end1'|'line-end2'|'circle-center'|'circle-radius', ... }

    // 量測狀態
    let measurePoints = [];         // 當前工具的點（最多存起點）
    let liveEnd = null;             // 即時預覽的終點位置
    let greenRegion = null;         // 綠色區塊描述
    let lastResult = null;
    // 最近一次完整選取（起點+終點），供邊緣增益重算使用；不會在量測後被清空
    let lastSelection = null;       // { tool, p0, p1 }
    let edgeGain = 1.0;             // 邊緣增益：>1 更靈敏，<1 過濾雜訊（提高門檻）
    // 基準雜訊門檻（梯度絕對值）；實際門檻 = BASE_EDGE_THRESHOLD / edgeGain
    const BASE_EDGE_THRESHOLD = 28;

    // ==================== 初始化鏡頭 ====================
    // preserveCalibration=true：換試件重新擷取，保留校正比例
    async function startCamera(preserveCalibration = false) {
      // 檢查是否為安全環境（HTTPS 或 localhost）
      const isSecure = window.isSecureContext || location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      
      if (!isSecure) {
        const currentUrl = location.href;
        const msg = `目前不是安全環境，無法使用相機。\n\n目前網址：${currentUrl}\n\n原因：手機瀏覽器只允許在 HTTPS 或 localhost 下開啟相機。\n透過 http://樹莓派IP 存取屬於非安全連線，瀏覽器會直接封鎖 getUserMedia。\n\n【推薦解決方法（由快到穩）】\n1. 使用 cloudflared 或 ngrok 建立暫時 HTTPS 隧道（最快，約1分鐘）\n2. 在樹莓派設定自簽 HTTPS 憑證\n3. 把檔案放到 GitHub Pages / Netlify 等免費 HTTPS 空間\n\n詳細步驟請看後續說明。`;
        alert(msg);
        updateHint('請改用 HTTPS 連線。目前為 http://IP 非安全環境，相機被瀏覽器封鎖。');
        document.getElementById('result-text').textContent = '相機無法使用：需要 HTTPS 環境（目前為 http://IP）。';
        return;
      }

      // 檢查 mediaDevices 支援
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        // 嘗試舊版 API（極少數舊瀏覽器）
        const getUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia;
        if (!getUserMedia) {
          alert('此瀏覽器不支援相機存取（getUserMedia）。\n請改用最新版 Chrome、Safari 或 Edge。');
          updateHint('瀏覽器不支援相機 API。');
          return;
        }
        // 舊版 callback 寫法（很少需要）
        alert('偵測到較舊的瀏覽器 API，建議更新瀏覽器以獲得最佳體驗。');
      }

      try {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
        }

        const constraints = {
          video: {
            facingMode: { ideal: 'environment' },  // 優先後置鏡頭
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.style.display = 'block';
        canvas.style.display = 'none';
        isCaptured = false;
        showViewZoomBar(false);
        resetViewTransform();
        if (!preserveCalibration) {
          pixelsPerUnit = 0;
        }
        torchOn = false;

        // 清除當前量測狀態（無論是否保留校正）
        measurePoints = [];
        liveEnd = null;
        greenRegion = null;
        lastResult = null;
        lastSelection = null;
        dragging = null;
        scaleVisible = false;
        document.getElementById('btn-toggle-scale').textContent = '顯示半透明尺規';
        showEdgeGainControls(false);

        // 取得 video track 並偵測可用能力
        videoTrack = stream.getVideoTracks()[0] || null;
        setupCameraControls(videoTrack);

        // 保留校正時：還原先前變焦／補光（避免重回 1.0x）
        if (preserveCalibration) {
          await restoreCameraOptics();
        } else {
          savedZoom = 1;
          savedTorch = false;
          torchOn = false;
        }

        if (preserveCalibration && pixelsPerUnit > 0) {
          const zHint = savedZoom > 1 ? `，變焦 ${Number(savedZoom).toFixed(1)}x 已還原` : '';
          updateHint(`鏡頭已開啟（校正比例 ${pixelsPerUnit.toFixed(2)} px/${currentUnit} 已保留${zHint}）。對準新試件後按「擷取影像」即可量測。`);
          document.getElementById('result-text').textContent =
            `校正仍有效（${pixelsPerUnit.toFixed(2)} px / ${currentUnit}）。請擷取新試件影像後直接量測。`;
        } else {
          updateHint('鏡頭已開啟。建議：先按「擷取影像」→ 用「兩點距離」選已知長度（出現綠色區塊＝自動邊緣）→ 輸入實際尺寸 →「完成校正」。半透明尺規僅為手動備援。');
          document.getElementById('result-text').textContent = '請先完成校正並擷取影像。';
        }
        resizeOverlay();
      } catch (err) {
        let msg = '無法開啟鏡頭：' + (err.message || err.name || '未知錯誤');
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          msg += '\n\n請到瀏覽器設定中允許此網站使用相機，然後重新整理頁面。';
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
          msg += '\n\n找不到可用的相機裝置。';
        } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
          msg += '\n\n相機可能被其他應用程式占用，請關閉其他使用相機的 App 後重試。';
        } else {
          msg += '\n\n請確認：\n• 已允許相機權限\n• 使用 HTTPS 或 localhost 開啟\n• 瀏覽器為最新版本';
        }
        alert(msg);
        updateHint('相機開啟失敗，請檢查權限與環境。');
        document.getElementById('result-text').textContent = '相機開啟失敗。';
      }
    }

    // ==================== 相機進階控制（變焦 / 補光 / 對焦 / ISO / 曝光） ====================
    function setupCameraControls(track) {
      const controls = document.getElementById('camera-controls-bar');
      const zoomLabel = document.getElementById('zoom-label');
      const zoomSlider = document.getElementById('zoom-slider');
      const zoomValue = document.getElementById('zoom-value');
      const btnTorch = document.getElementById('btn-torch');
      const focusLabel = document.getElementById('focus-label');
      const focusMode = document.getElementById('focus-mode');
      const focusSlider = document.getElementById('focus-slider');
      const isoLabel = document.getElementById('iso-label');
      const isoSlider = document.getElementById('iso-slider');
      const isoValue = document.getElementById('iso-value');
      const evLabel = document.getElementById('ev-label');
      const evSlider = document.getElementById('ev-slider');
      const evValue = document.getElementById('ev-value');
      const hint = document.getElementById('cam-capability-hint');

      // 先全部隱藏子控制
      [zoomLabel, zoomSlider, zoomValue, btnTorch, focusLabel, focusMode, focusSlider,
        isoLabel, isoSlider, isoValue, evLabel, evSlider, evValue].forEach(el => {
        if (el) el.style.display = 'none';
      });
      controls.style.display = 'none';
      hint.textContent = '';

      if (!track || typeof track.getCapabilities !== 'function') {
        hint.textContent = '此瀏覽器／裝置不支援進階相機控制（常見於 iOS Safari）。變焦、對焦、ISO、曝光需由系統相機 App 或支援的 Android Chrome 提供。';
        controls.style.display = 'flex';
        return;
      }

      const caps = track.getCapabilities();
      const settings = typeof track.getSettings === 'function' ? track.getSettings() : {};
      let hasAny = false;
      let unsupported = [];
      let supported = [];

      // 變焦
      if (caps.zoom && (caps.zoom.max || 1) > (caps.zoom.min || 1)) {
        const min = caps.zoom.min || 1;
        const max = caps.zoom.max || 1;
        const step = caps.zoom.step || 0.1;
        zoomSlider.min = min;
        zoomSlider.max = max;
        zoomSlider.step = step;
        zoomSlider.value = settings.zoom != null ? settings.zoom : min;
        zoomValue.textContent = Number(zoomSlider.value).toFixed(1) + 'x';
        zoomLabel.style.display = 'inline';
        zoomSlider.style.display = 'inline-block';
        zoomValue.style.display = 'inline';
        hasAny = true;
        supported.push('變焦');
      } else {
        unsupported.push('變焦');
      }

      // 補光
      if (caps.torch) {
        btnTorch.style.display = 'inline-block';
        btnTorch.textContent = torchOn ? '關閉補光' : '開啟補光';
        hasAny = true;
        supported.push('補光');
      } else {
        unsupported.push('補光燈');
      }

      // 對焦模式
      if (caps.focusMode && Array.isArray(caps.focusMode) && caps.focusMode.length) {
        focusMode.innerHTML = '';
        caps.focusMode.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m === 'continuous' ? '連續' : m === 'manual' ? '手動' : m === 'single-shot' ? '單次' : m;
          focusMode.appendChild(opt);
        });
        if (settings.focusMode) focusMode.value = settings.focusMode;
        focusLabel.style.display = 'inline';
        focusMode.style.display = 'inline-block';
        hasAny = true;
        supported.push('對焦模式');
        // 手動對焦距離
        if (caps.focusDistance && (caps.focusDistance.max || 0) > (caps.focusDistance.min || 0)) {
          focusSlider.min = caps.focusDistance.min;
          focusSlider.max = caps.focusDistance.max;
          focusSlider.step = caps.focusDistance.step || 0.01;
          focusSlider.value = settings.focusDistance != null ? settings.focusDistance : caps.focusDistance.min;
          focusSlider.style.display = 'inline-block';
          supported.push('對焦距離');
        }
      } else if (!caps.focusMode && !caps.focusDistance) {
        unsupported.push('手動對焦');
      } else {
        unsupported.push('手動對焦');
      }

      // ISO
      if (caps.iso && (caps.iso.max || 0) > (caps.iso.min || 0)) {
        isoSlider.min = caps.iso.min;
        isoSlider.max = caps.iso.max;
        isoSlider.step = caps.iso.step || 1;
        isoSlider.value = settings.iso != null ? settings.iso : caps.iso.min;
        isoValue.textContent = String(Math.round(isoSlider.value));
        isoLabel.style.display = 'inline';
        isoSlider.style.display = 'inline-block';
        isoValue.style.display = 'inline';
        hasAny = true;
        supported.push('ISO');
      } else {
        unsupported.push('ISO');
      }

      // 曝光補償
      if (caps.exposureCompensation && (caps.exposureCompensation.max || 0) > (caps.exposureCompensation.min || 0)) {
        evSlider.min = caps.exposureCompensation.min;
        evSlider.max = caps.exposureCompensation.max;
        evSlider.step = caps.exposureCompensation.step || 0.1;
        evSlider.value = settings.exposureCompensation != null ? settings.exposureCompensation : 0;
        evValue.textContent = Number(evSlider.value).toFixed(1);
        evLabel.style.display = 'inline';
        evSlider.style.display = 'inline-block';
        evValue.style.display = 'inline';
        hasAny = true;
        supported.push('曝光');
      } else {
        unsupported.push('曝光控制');
      }

      controls.style.display = 'flex';
      const parts = [];
      if (supported.length) parts.push('可用：' + supported.join('、'));
      if (unsupported.length) parts.push('不支援：' + unsupported.join('、'));
      parts.push('（實際能否操作取決於手機硬體與瀏覽器，iOS 通常幾乎都不開放）');
      hint.textContent = parts.join('　');
    }

    async function applyFocusMode(mode) {
      if (!videoTrack) return;
      try {
        await videoTrack.applyConstraints({ advanced: [{ focusMode: mode }] });
      } catch (e) { console.warn('對焦模式失敗', e); }
    }
    async function applyFocusDistance(v) {
      if (!videoTrack) return;
      try {
        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: Number(v) }] });
      } catch (e) { console.warn('對焦距離失敗', e); }
    }
    async function applyIso(v) {
      if (!videoTrack) return;
      try {
        await videoTrack.applyConstraints({ advanced: [{ iso: Number(v) }] });
        document.getElementById('iso-value').textContent = String(Math.round(Number(v)));
      } catch (e) { console.warn('ISO 失敗', e); }
    }
    async function applyEv(v) {
      if (!videoTrack) return;
      try {
        await videoTrack.applyConstraints({ advanced: [{ exposureCompensation: Number(v) }] });
        document.getElementById('ev-value').textContent = Number(v).toFixed(1);
      } catch (e) { console.warn('曝光失敗', e); }
    }

    // 套用變焦
    async function applyZoom(value) {
      if (!videoTrack) return;
      try {
        const z = Number(value);
        await videoTrack.applyConstraints({ advanced: [{ zoom: z }] });
        savedZoom = z;
        document.getElementById('zoom-value').textContent = z.toFixed(1) + 'x';
        const slider = document.getElementById('zoom-slider');
        if (slider) slider.value = z;
      } catch (e) {
        console.warn('變焦失敗', e);
      }
    }

    // 重新開啟鏡頭後還原變焦（與可選補光）
    async function restoreCameraOptics() {
      if (!videoTrack) return;
      try {
        const caps = typeof videoTrack.getCapabilities === 'function' ? videoTrack.getCapabilities() : {};
        const advanced = [];
        if (caps.zoom && savedZoom > 1) {
          const min = caps.zoom.min || 1;
          const max = caps.zoom.max || savedZoom;
          const z = Math.max(min, Math.min(max, savedZoom));
          advanced.push({ zoom: z });
          savedZoom = z;
        }
        if (caps.torch && savedTorch) {
          advanced.push({ torch: true });
          torchOn = true;
        }
        if (advanced.length) {
          await videoTrack.applyConstraints({ advanced });
        }
        // 同步 UI
        const slider = document.getElementById('zoom-slider');
        const zoomValue = document.getElementById('zoom-value');
        if (slider && caps.zoom) {
          slider.value = savedZoom;
          if (zoomValue) zoomValue.textContent = Number(savedZoom).toFixed(1) + 'x';
        }
        const btnTorch = document.getElementById('btn-torch');
        if (btnTorch && caps.torch) {
          btnTorch.textContent = torchOn ? '關閉補光' : '開啟補光';
        }
      } catch (e) {
        console.warn('還原變焦/補光失敗', e);
      }
    }

    // 開關補光燈
    async function toggleTorch() {
      if (!videoTrack) return;
      try {
        torchOn = !torchOn;
        savedTorch = torchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
        const btn = document.getElementById('btn-torch');
        btn.textContent = torchOn ? '關閉補光' : '開啟補光';
        btn.style.background = torchOn ? '#ca8a04' : '';
      } catch (e) {
        console.warn('補光燈切換失敗', e);
        alert('此裝置無法控制補光燈');
        torchOn = false;
      }
    }

    // ==================== 尺寸與覆蓋層同步 ====================
    function resizeOverlay() {
      const area = document.getElementById('image-area');
      const rect = area.getBoundingClientRect();
      // 已擷取後：鎖定為 canvas 緩衝尺寸，避免結果列／工具列變高造成座標系偏移
      if (isCaptured && canvas.width > 0 && canvas.height > 0) {
        overlay.width = canvas.width;
        overlay.height = canvas.height;
        overlay.style.width = canvas.width + 'px';
        overlay.style.height = canvas.height + 'px';
        // 讓 overlay 與 canvas 同位置對齊（置中於 image-area）
        const scale = Math.min(rect.width / canvas.width, rect.height / canvas.height);
        const dispW = canvas.width * scale;
        const dispH = canvas.height * scale;
        const ox = (rect.width - dispW) / 2;
        const oy = (rect.height - dispH) / 2;
        overlay.style.left = ox + 'px';
        overlay.style.top = oy + 'px';
        overlay.style.width = dispW + 'px';
        overlay.style.height = dispH + 'px';
        // 注意：width/height 屬性仍為 canvas 像素座標，style 只負責顯示縮放
        canvas.style.width = dispW + 'px';
        canvas.style.height = dispH + 'px';
        drawOverlay();
        return;
      }
      const w = Math.floor(rect.width);
      const h = Math.floor(rect.height);
      overlay.width = w;
      overlay.height = h;
      overlay.style.left = '0';
      overlay.style.top = '0';
      overlay.style.width = w + 'px';
      overlay.style.height = h + 'px';
      drawOverlay();
    }
    window.addEventListener('resize', resizeOverlay);

    function showViewZoomBar(show) {
      const bar = document.getElementById('view-zoom-bar');
      if (bar) bar.style.display = show ? 'flex' : 'none';
    }
    function resetViewTransform() {
      viewZoom = 1;
      viewPanX = 0;
      viewPanY = 0;
      applyViewTransform();
    }
    function applyViewTransform() {
      const stage = document.getElementById('image-stage');
      if (!stage) return;
      stage.style.transform = `translate(${viewPanX}px, ${viewPanY}px) scale(${viewZoom})`;
      const label = document.getElementById('view-zoom-label');
      if (label) label.textContent = viewZoom.toFixed(1) + 'x';
    }
    function setViewZoom(z, focusClientX, focusClientY) {
      const prev = viewZoom;
      viewZoom = Math.max(1, Math.min(8, z));
      // 以焦點為中心縮放（可選）
      if (focusClientX != null && focusClientY != null && prev > 0) {
        const area = document.getElementById('image-area').getBoundingClientRect();
        const cx = focusClientX - (area.left + area.width / 2);
        const cy = focusClientY - (area.top + area.height / 2);
        const ratio = viewZoom / prev;
        viewPanX = cx - (cx - viewPanX) * ratio;
        viewPanY = cy - (cy - viewPanY) * ratio;
      }
      if (viewZoom === 1) { viewPanX = 0; viewPanY = 0; }
      applyViewTransform();
    }

    // ==================== 載入本機影像（無相機亦可量測） ====================
    function loadImageFromFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        alert('請選擇圖片檔（JPG／PNG／WebP 等）');
        return;
      }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        // 關閉相機（若有）
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
          videoTrack = null;
          video.srcObject = null;
        }
        const camControls = document.getElementById('camera-controls-bar');
        if (camControls) camControls.style.display = 'none';

        video.style.display = 'none';
        canvas.style.display = 'block';

        // 以圖片原始解析度繪入 canvas（上限避免過大記憶體）
        const maxSide = 2400;
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        if (Math.max(w, h) > maxSide) {
          const s = maxSide / Math.max(w, h);
          w = Math.round(w * s);
          h = Math.round(h * s);
        }
        canvas.width = w;
        canvas.height = h;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);

        isCaptured = true;
        measurePoints = [];
        liveEnd = null;
        greenRegion = null;
        lastResult = null;
        lastSelection = null;
        dragging = null;
        showEdgeGainControls(false);
        showViewZoomBar(true);
        resetViewTransform();

        if (pixelsPerUnit <= 0) {
          updateHint('已載入影像。用「兩點距離」或「圓形」選已知尺寸完成校正，或先完成校正後量測。');
          document.getElementById('result-text').textContent = '影像已載入。請校正或選擇量測工具。';
        } else {
          updateHint('已載入影像（校正比例仍有效）。可直接量測，或使用右下角數位縮放檢視邊緣。');
          document.getElementById('result-text').textContent = '影像已載入，可開始量測。';
        }
        void document.body.offsetHeight;
        resizeOverlay();
        requestAnimationFrame(() => { resizeOverlay(); drawOverlay(); });
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        alert('無法讀取此影像檔');
      };
      img.src = url;
    }

    // ==================== 繪製覆蓋層（尺規 + 綠色區塊 + 量測標記） ====================
    function drawOverlay() {
      octx.clearRect(0, 0, overlay.width, overlay.height);

      // 1. 半透明尺規（提高可見度）
      if (scaleVisible && !isCaptured) {
        octx.save();
        // 先畫一層半透明底，增加對比
        octx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        octx.fillRect(0, 0, overlay.width, overlay.height);

        octx.globalAlpha = 0.92;
        octx.strokeStyle = '#facc15';   // 亮黃色，更醒目
        octx.fillStyle = '#facc15';
        octx.lineWidth = 4;
        octx.setLineDash([]);

        if (scaleMode === 'line') {
          octx.beginPath();
          octx.moveTo(lineScale.x1, lineScale.y1);
          octx.lineTo(lineScale.x2, lineScale.y2);
          octx.stroke();
          // 兩端控制點（更大更明顯）
          drawHandle(lineScale.x1, lineScale.y1, 12);
          drawHandle(lineScale.x2, lineScale.y2, 12);
          // 刻度示意
          const dx = lineScale.x2 - lineScale.x1;
          const dy = lineScale.y2 - lineScale.y1;
          const len = Math.hypot(dx, dy) || 1;
          const ux = dx / len, uy = dy / len;
          octx.lineWidth = 3;
          for (let i = 0; i <= 10; i++) {
            const t = i / 10;
            const px = lineScale.x1 + dx * t;
            const py = lineScale.y1 + dy * t;
            const tick = (i % 5 === 0) ? 14 : 8;
            octx.beginPath();
            octx.moveTo(px - uy * tick, py + ux * tick);
            octx.lineTo(px + uy * tick, py - ux * tick);
            octx.stroke();
          }
        } else {
          // 圓形尺規
          octx.lineWidth = 4;
          octx.beginPath();
          octx.arc(circleScale.cx, circleScale.cy, circleScale.r, 0, Math.PI * 2);
          octx.stroke();
          // 十字中心
          octx.lineWidth = 3;
          octx.beginPath();
          octx.moveTo(circleScale.cx - 14, circleScale.cy);
          octx.lineTo(circleScale.cx + 14, circleScale.cy);
          octx.moveTo(circleScale.cx, circleScale.cy - 14);
          octx.lineTo(circleScale.cx, circleScale.cy + 14);
          octx.stroke();
          drawHandle(circleScale.cx, circleScale.cy, 12);
          drawHandle(circleScale.cx + circleScale.r, circleScale.cy, 12);
        }
        octx.restore();
      }

      // 2. 綠色半透明區塊（量測時，提高可見度）
      if (greenRegion && isCaptured) {
        octx.save();
        octx.fillStyle = 'rgba(34, 197, 94, 0.38)';
        octx.strokeStyle = 'rgba(22, 163, 74, 1)';
        octx.lineWidth = 3;
        octx.setLineDash([]);

        if (greenRegion.type === 'band') {
          // 帶狀（兩點距離）
          drawBand(greenRegion.x1, greenRegion.y1, greenRegion.x2, greenRegion.y2, greenRegion.width);
        } else if (greenRegion.type === 'rect') {
          octx.fillRect(greenRegion.x, greenRegion.y, greenRegion.w, greenRegion.h);
          octx.strokeRect(greenRegion.x, greenRegion.y, greenRegion.w, greenRegion.h);
        } else if (greenRegion.type === 'circle') {
          // 填滿整個選取圓盤，確保內側小孔也在自動邊緣計算範圍內
          octx.beginPath();
          octx.arc(greenRegion.cx, greenRegion.cy, greenRegion.r + (greenRegion.expand || 0), 0, Math.PI * 2);
          octx.fill();
          octx.stroke();
        }
        octx.restore();
      }

      // 3. 量測標記與自動邊緣點
      if (lastResult && isCaptured) {
        octx.save();
        octx.strokeStyle = '#f472b6';
        octx.fillStyle = '#f472b6';
        octx.lineWidth = 2;
        octx.setLineDash([]);

        if (lastResult.tool === 'line' && lastResult.autoStart && lastResult.autoEnd) {
          octx.beginPath();
          octx.moveTo(lastResult.autoStart.x, lastResult.autoStart.y);
          octx.lineTo(lastResult.autoEnd.x, lastResult.autoEnd.y);
          octx.stroke();
          drawCross(lastResult.autoStart.x, lastResult.autoStart.y);
          drawCross(lastResult.autoEnd.x, lastResult.autoEnd.y);
        } else if (lastResult.tool === 'rect' && lastResult.outer) {
          const r = lastResult.outer;
          octx.strokeRect(r.x, r.y, r.w, r.h);
          if (lastResult.inner) {
            const i = lastResult.inner;
            octx.setLineDash([4, 3]);
            octx.strokeRect(i.x, i.y, i.w, i.h);
          }
        } else if (lastResult.tool === 'circle') {
          const radiiToDraw = lastResult.radii && lastResult.radii.length
            ? lastResult.radii
            : (lastResult.outerR ? [lastResult.outerR, lastResult.innerR].filter(Boolean) : []);
          radiiToDraw.forEach((rad, idx) => {
            octx.beginPath();
            octx.arc(lastResult.cx, lastResult.cy, rad, 0, Math.PI * 2);
            octx.setLineDash(idx === 0 ? [] : [5, 4]);
            octx.stroke();
          });
          drawCross(lastResult.cx, lastResult.cy);
        }
        octx.restore();
      }

      // 4. 當前正在畫的臨時圖形
      if (measurePoints.length > 0 && currentTool) {
        octx.save();
        octx.strokeStyle = '#a78bfa';
        octx.lineWidth = 1.5;
        octx.setLineDash([4, 3]);
        if (currentTool === 'line' && measurePoints.length === 1) {
          // 等第二點
        } else if (currentTool === 'line' && measurePoints.length === 2) {
          octx.beginPath();
          octx.moveTo(measurePoints[0].x, measurePoints[0].y);
          octx.lineTo(measurePoints[1].x, measurePoints[1].y);
          octx.stroke();
        } else if (currentTool === 'rect' && measurePoints.length === 2) {
          const x = Math.min(measurePoints[0].x, measurePoints[1].x);
          const y = Math.min(measurePoints[0].y, measurePoints[1].y);
          const w = Math.abs(measurePoints[1].x - measurePoints[0].x);
          const h = Math.abs(measurePoints[1].y - measurePoints[0].y);
          octx.strokeRect(x, y, w, h);
        } else if (currentTool === 'circle' && measurePoints.length === 2) {
          const r = Math.hypot(measurePoints[1].x - measurePoints[0].x, measurePoints[1].y - measurePoints[0].y);
          octx.beginPath();
          octx.arc(measurePoints[0].x, measurePoints[0].y, r, 0, Math.PI * 2);
          octx.stroke();
        }
        octx.restore();
      }
    }

    function drawHandle(x, y, radius = 9) {
      octx.beginPath();
      octx.arc(x, y, radius, 0, Math.PI * 2);
      octx.fill();
      octx.strokeStyle = '#fff';
      octx.lineWidth = 2;
      octx.stroke();
    }
    function drawCross(x, y) {
      octx.beginPath();
      octx.moveTo(x - 7, y); octx.lineTo(x + 7, y);
      octx.moveTo(x, y - 7); octx.lineTo(x, y + 7);
      octx.stroke();
    }
    function drawBand(x1, y1, x2, y2, width) {
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const ux = -dy / len * width, uy = dx / len * width;
      octx.beginPath();
      octx.moveTo(x1 + ux, y1 + uy);
      octx.lineTo(x2 + ux, y2 + uy);
      octx.lineTo(x2 - ux, y2 - uy);
      octx.lineTo(x1 - ux, y1 - uy);
      octx.closePath();
      octx.fill();
      octx.stroke();
    }

    // ==================== 校正完成 ====================
    function finishCalibration() {
      const actual = parseFloat(document.getElementById('actual-size').value);
      if (!actual || actual <= 0) {
        alert('請輸入有效的實際尺寸');
        return;
      }
      currentUnit = document.getElementById('unit').value;

      // 優先使用「自動邊緣偵測」得到的像素距離（降低人為誤差）
      let pixelLen = 0;
      let method = '';

      if (lastPixelForCalib > 5) {
        pixelLen = lastPixelForCalib;
        method = '自動邊緣偵測';
      } else if (scaleVisible) {
        // 後備：使用手動尺規
        if (scaleMode === 'line') {
          pixelLen = Math.hypot(lineScale.x2 - lineScale.x1, lineScale.y2 - lineScale.y1);
        } else {
          pixelLen = circleScale.r * 2;
        }
        method = '手動尺規';
      }

      if (pixelLen < 5) {
        alert('【自動邊緣校正】請先擷取影像 → 選「兩點距離」在已知尺寸物件上點選兩點（會出現綠色區塊並自動對邊）→ 輸入實際尺寸後再按完成校正。\n\n【手動備援】也可開啟「半透明尺規」拖曳對齊後直接完成校正（不會出現綠色區塊）。');
        return;
      }

      pixelsPerUnit = pixelLen / actual;
      scaleVisible = false;
      document.getElementById('btn-toggle-scale').textContent = '顯示半透明尺規';
      updateHint(`校正完成！（${method}）比例 = ${pixelsPerUnit.toFixed(2)} px / ${currentUnit}。現在可以使用其他工具進行量測。`);
      document.getElementById('result-text').innerHTML =
        `校正完成<br>使用方式：${method}<br>像素距離：${pixelLen.toFixed(1)} px → 實際：${actual} ${currentUnit}<br>` +
        `比例：${pixelsPerUnit.toFixed(2)} px / ${currentUnit}`;
      drawOverlay();
    }

    // ==================== 擷取影像 ====================
    function captureImage() {
      if (!stream && !video.srcObject) {
        // 若已關閉串流但仍有最後一幀，允許重擷取提示
        if (!isCaptured) {
          alert('請先開啟鏡頭');
          return;
        }
      }
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if ((!vw || !vh) && !isCaptured) {
        alert('鏡頭尚未就緒，請稍候再試');
        return;
      }
      if (vw && vh) {
        // 將 video 畫到 canvas，保持比例並置中於 overlay 尺寸
        const area = document.getElementById('image-area');
        const rect = area.getBoundingClientRect();
        const areaW = rect.width;
        const areaH = rect.height;
        const scale = Math.min(areaW / vw, areaH / vh);
        const drawW = vw * scale;
        const drawH = vh * scale;
        const offsetX = (areaW - drawW) / 2;
        const offsetY = (areaH - drawH) / 2;

        canvas.width = areaW;
        canvas.height = areaH;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, areaW, areaH);
        ctx.drawImage(video, offsetX, offsetY, drawW, drawH);
      }

      // 關閉前記住變焦／補光，供「重新擷取」還原
      if (videoTrack && typeof videoTrack.getSettings === 'function') {
        try {
          const s = videoTrack.getSettings();
          if (s.zoom != null) savedZoom = s.zoom;
        } catch (_) {}
      }
      savedTorch = torchOn;

      // 關閉相機串流，釋放硬體（不再背景持續開啟）
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        videoTrack = null;
        video.srcObject = null;
      }

      // 相機控制列在影像下方：直接隱藏即可，不影響影像區位置
      const camControls = document.getElementById('camera-controls-bar');
      if (camControls) camControls.style.display = 'none';

      video.style.display = 'none';
      canvas.style.display = 'block';
      isCaptured = true;
      showViewZoomBar(true);
      resetViewTransform();
      measurePoints = [];
      liveEnd = null;
      greenRegion = null;
      lastResult = null;
      lastSelection = null;
      dragging = null;
      if (pixelsPerUnit <= 0) {
        updateHint('影像已擷取，相機已關閉。直線已知物：用「兩點距離」；圓形已知物：用「圓形」點中心→邊緣。完成後可調邊緣增益，再輸入實際尺寸按「完成校正」。');
        document.getElementById('result-text').textContent = '尚未校正。直線用兩點距離；圓形尺規建議用「圓形」工具選外徑後完成校正。';
      } else {
        updateHint('影像已擷取，相機已關閉。選擇工具後，點選起點會即時顯示綠色邊緣範圍，確認後再點終點即可自動計算。完成後可用邊緣增益微調。');
        document.getElementById('result-text').textContent = '請選擇量測工具並在影像上操作。';
      }
      // 強制 reflow 後再同步 overlay，避免控制列高度變化造成準心相對偏移
      void document.body.offsetHeight;
      resizeOverlay();
      requestAnimationFrame(() => {
        resizeOverlay();
        drawOverlay();
      });
    }

    // ==================== 簡易邊緣偵測（純 JS，降低人為誤差） ====================
    // 在指定區域內找梯度最強的點
    function getImageDataSafe() {
      try {
        return ctx.getImageData(0, 0, canvas.width, canvas.height);
      } catch (e) {
        return null;
      }
    }

    function gradientAt(imgData, x, y) {
      const w = imgData.width, h = imgData.height;
      x = Math.max(1, Math.min(w - 2, Math.round(x)));
      y = Math.max(1, Math.min(h - 2, Math.round(y)));
      const idx = (y * w + x) * 4;
      const data = imgData.data;
      // 簡單 Sobel 近似（灰階）
      const gray = (i) => 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
      const tl = gray(idx - w*4 - 4), tc = gray(idx - w*4), tr = gray(idx - w*4 + 4);
      const ml = gray(idx - 4),           mr = gray(idx + 4);
      const bl = gray(idx + w*4 - 4), bc = gray(idx + w*4), br = gray(idx + w*4 + 4);
      const gx = -tl + tr - 2*ml + 2*mr - bl + br;
      const gy = -tl - 2*tc - tr + bl + 2*bc + br;
      // 套用增益：放大梯度後再與門檻比較，利於過濾弱雜訊
      return (Math.abs(gx) + Math.abs(gy)) * edgeGain;
    }

    function getEdgeThreshold() {
      // 增益越高 → 有效門檻越低（更靈敏）；增益越低 → 門檻越高（過濾雜訊）
      return BASE_EDGE_THRESHOLD;
    }

    // 兩點距離：在帶狀區域兩端找最強邊緣點（支援增益／門檻過濾雜訊）
    function autoEdgeLine(x1, y1, x2, y2, bandWidth) {
      const imgData = getImageDataSafe();
      if (!imgData) return { start: {x:x1,y:y1}, end: {x:x2,y:y2} };

      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const px = -uy, py = ux; // 垂直方向
      const minG = getEdgeThreshold();

      function findStrongestNear(cx, cy, searchRadius) {
        // 優先沿「垂直於量測線」方向搜尋真實邊緣，減少沿線雜訊干擾
        let best = { x: cx, y: cy, g: -1 };
        const normalSteps = Math.max(searchRadius, 12);
        // 1) 沿法線方向精細掃描（最能對準邊緣）
        for (let d = -normalSteps; d <= normalSteps; d++) {
          const sx = cx + px * d;
          const sy = cy + py * d;
          const proj = ((sx - x1) * ux + (sy - y1) * uy);
          if (proj < -8 || proj > len + 8) continue;
          const distToLine = Math.abs((sx - x1) * px + (sy - y1) * py);
          if (distToLine > bandWidth + 2) continue;
          const g = gradientAt(imgData, sx, sy);
          if (g < minG) continue; // 低於門檻視為雜訊，略過
          if (g > best.g) best = { x: sx, y: sy, g };
        }
        // 2) 若法線方向找不到夠強的點，再做小範圍環狀備援搜尋
        if (best.g < minG) {
          for (let r = 0; r <= searchRadius; r += 1) {
            for (let a = 0; a < 20; a++) {
              const ang = (a / 20) * Math.PI * 2;
              const sx = cx + Math.cos(ang) * r;
              const sy = cy + Math.sin(ang) * r;
              const proj = ((sx - x1) * ux + (sy - y1) * uy);
              if (proj < -5 || proj > len + 5) continue;
              const distToLine = Math.abs((sx - x1) * px + (sy - y1) * py);
              if (distToLine > bandWidth) continue;
              const g = gradientAt(imgData, sx, sy);
              if (g < minG) continue;
              if (g > best.g) best = { x: sx, y: sy, g };
            }
          }
        }
        // 若仍無合格邊緣，退回原點（不亂跳）
        if (best.g < 0) return { x: cx, y: cy, g: 0 };
        return best;
      }

      const searchR = Math.max(bandWidth, 18);
      const start = findStrongestNear(x1, y1, searchR);
      const end   = findStrongestNear(x2, y2, searchR);
      return { start: { x: start.x, y: start.y }, end: { x: end.x, y: end.y } };
    }

    // 矩形：在四邊擴張區域找強邊緣，嘗試偵測內外
    function autoEdgeRect(rx, ry, rw, rh, expand) {
      const imgData = getImageDataSafe();
      if (!imgData) {
        return { outer: { x: rx, y: ry, w: rw, h: rh }, inner: null };
      }

      // 簡化：對每條邊取中點附近最強梯度位置，微調邊界
      function sampleEdge(x0, y0, x1, y1, outwardX, outwardY) {
        const samples = [];
        const steps = 12;
        const minG = getEdgeThreshold();
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const bx = x0 + (x1 - x0) * t;
          const by = y0 + (y1 - y0) * t;
          let bestG = -1, bestD = 0;
          for (let d = -expand; d <= expand; d++) {
            const sx = bx + outwardX * d;
            const sy = by + outwardY * d;
            const g = gradientAt(imgData, sx, sy);
            if (g < minG) continue; // 低於門檻略過雜訊
            if (g > bestG) { bestG = g; bestD = d; }
          }
          // 若此點整條掃描都沒有合格邊緣，維持 0（不偏移）
          samples.push(bestG >= minG ? bestD : 0);
        }
        // 取中位數
        samples.sort((a,b)=>a-b);
        return samples[Math.floor(samples.length/2)];
      }

      const leftD  = sampleEdge(rx, ry, rx, ry+rh, -1, 0);
      const rightD = sampleEdge(rx+rw, ry, rx+rw, ry+rh, 1, 0);
      const topD   = sampleEdge(rx, ry, rx+rw, ry, 0, -1);
      const botD   = sampleEdge(rx, ry+rh, rx+rw, ry+rh, 0, 1);

      const outer = {
        x: rx + leftD,
        y: ry + topD,
        w: rw + (rightD - leftD),
        h: rh + (botD - topD)
      };

      // 嘗試找內框：在更內側再搜一次（簡化版，實際可再優化）
      let inner = null;
      if (rw > 30 && rh > 30) {
        const inset = Math.min(rw, rh) * 0.15;
        const ix = rx + inset, iy = ry + inset, iw = rw - inset*2, ih = rh - inset*2;
        const iLeft  = sampleEdge(ix, iy, ix, iy+ih, -1, 0);
        const iRight = sampleEdge(ix+iw, iy, ix+iw, iy+ih, 1, 0);
        const iTop   = sampleEdge(ix, iy, ix+iw, iy, 0, -1);
        const iBot   = sampleEdge(ix, iy+ih, ix+iw, iy+ih, 0, 1);
        inner = {
          x: ix + iLeft,
          y: iy + iTop,
          w: iw + (iRight - iLeft),
          h: ih + (iBot - iTop)
        };
        // 若內外差異太小則忽略內框
        if (Math.abs(inner.w - outer.w) < 4 && Math.abs(inner.h - outer.h) < 4) {
          inner = null;
        }
      }
      return { outer, inner };
    }

    // 灰階取樣（雙線性）
    function sampleGray(imgData, x, y) {
      const w = imgData.width, h = imgData.height;
      const data = imgData.data;
      if (x < 0 || y < 0 || x >= w - 1 || y >= h - 1) return 0;
      const x0 = Math.floor(x), y0 = Math.floor(y);
      const fx = x - x0, fy = y - y0;
      const at = (ix, iy) => {
        const i = (iy * w + ix) * 4;
        return 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      };
      const g00 = at(x0, y0), g10 = at(x0 + 1, y0);
      const g01 = at(x0, y0 + 1), g11 = at(x0 + 1, y0 + 1);
      return g00 * (1 - fx) * (1 - fy) + g10 * fx * (1 - fy) + g01 * (1 - fx) * fy + g11 * fx * fy;
    }

    // 亞像素峰值（3 點二次多項式）
    function subpixelPeak(y0, y1, y2) {
      const denom = 2 * (2 * y1 - y0 - y2);
      if (Math.abs(denom) < 1e-6) return 0;
      const d = (y0 - y2) / denom;
      return Math.max(-0.5, Math.min(0.5, d));
    }

    /**
     * 5 點高斯／二次亞像素定位
     * samples: 以 peakIdx 為中心的強度陣列（長度>=5）
     * 回傳相對於 peakIdx 的偏移（可為小數）
     */
    function subpixelFit5(samples, peakIdx) {
      if (!samples || samples.length < 3) return 0;
      const i = Math.max(1, Math.min(samples.length - 2, peakIdx));
      // 優先 3 點二次
      let d = subpixelPeak(samples[i - 1], samples[i], samples[i + 1]);
      // 若有 5 點，用對數域近似高斯（log y ≈ a + b x + c x^2）
      if (i >= 2 && i <= samples.length - 3) {
        const ys = [];
        const xs = [-2, -1, 0, 1, 2];
        let ok = true;
        for (let k = -2; k <= 2; k++) {
          const v = samples[i + k];
          if (v <= 1e-6) { ok = false; break; }
          ys.push(Math.log(v));
        }
        if (ok) {
          // 最小二乘擬合 c, b（對稱）: y = a + b x + c x^2
          // 對 x^2 與 x 正規方程簡化
          let sX2 = 0, sX4 = 0, sY = 0, sYX2 = 0, sYX = 0, sX = 0;
          for (let k = 0; k < 5; k++) {
            const x = xs[k], y = ys[k];
            sX += x; sX2 += x * x; sX4 += x * x * x * x;
            sY += y; sYX += y * x; sYX2 += y * x * x;
          }
          const n = 5;
          // b = sYX / sX2 (sX=0 for symmetric)
          // c from (sYX2 - c terms)
          const b = sYX / (sX2 || 1);
          const c = (n * sYX2 - sY * sX2) / (n * sX4 - sX2 * sX2 || 1);
          if (c < -1e-6) {
            // 峰值在 x = -b/(2c)
            const mu = -b / (2 * c);
            if (Math.abs(mu) <= 1.5) d = mu;
          }
        }
      }
      return Math.max(-1.2, Math.min(1.2, d));
    }

    /** 沿射線以 0.25px 取樣，回傳亞像素邊緣半徑（半高 + 局部峰值擬合） */
    function radialEdgeSubpixel(imgData, cx, cy, cos, sin, approxR, searchHalf) {
      const step = 0.25;
      const n = Math.floor((2 * searchHalf) / step) + 1;
      const mags = new Float64Array(n);
      const rads = new Float64Array(n);
      let bestI = 0, bestM = -1;
      for (let i = 0; i < n; i++) {
        const rad = approxR - searchHalf + i * step;
        rads[i] = rad;
        if (rad < 2) { mags[i] = 0; continue; }
        const g1 = sampleGray(imgData, cx + cos * (rad - step), cy + sin * (rad - step));
        const g2 = sampleGray(imgData, cx + cos * (rad + step), cy + sin * (rad + step));
        const mag = Math.abs(g2 - g1);
        mags[i] = mag;
        if (mag > bestM) { bestM = mag; bestI = i; }
      }
      if (bestM < 1e-3) return approxR;

      // 峰值亞像素
      const dPeak = subpixelFit5(Array.from(mags), bestI);
      let edgeR = rads[bestI] + dPeak * step;

      // 半高交越精修（內外代表灰階）
      const peakR = edgeR;
      const gIn = sampleGray(imgData, cx + cos * Math.max(2, peakR - 4), cy + sin * Math.max(2, peakR - 4));
      const gOut = sampleGray(imgData, cx + cos * (peakR + 4), cy + sin * (peakR + 4));
      if (Math.abs(gOut - gIn) >= 5) {
        const mid = (gIn + gOut) * 0.5;
        let prevG = sampleGray(imgData, cx + cos * (peakR - 3), cy + sin * (peakR - 3));
        let prevR = peakR - 3;
        for (let rad = peakR - 3 + 0.1; rad <= peakR + 3; rad += 0.1) {
          const g = sampleGray(imgData, cx + cos * rad, cy + sin * rad);
          if ((prevG - mid) * (g - mid) <= 0 && Math.abs(g - prevG) > 1e-3) {
            const t = (mid - prevG) / (g - prevG);
            edgeR = prevR + 0.1 * Math.max(0, Math.min(1, t));
            break;
          }
          prevG = g;
          prevR = rad;
        }
      }
      return edgeR;
    }

    // 代數圓擬合（x²+y² + D x + E y + F = 0）→ 回傳 {cx, cy, r} 或 null
    function fitCircleAlgebraic(pts) {
      const n = pts.length;
      if (n < 12) return null;
      let sumX = 0, sumY = 0, sumX2 = 0, sumY2 = 0, sumXY = 0;
      let sumX3 = 0, sumY3 = 0, sumX2Y = 0, sumXY2 = 0;
      for (const p of pts) {
        const x = p.x, y = p.y;
        sumX += x; sumY += y;
        sumX2 += x * x; sumY2 += y * y; sumXY += x * y;
        sumX3 += x * x * x; sumY3 += y * y * y;
        sumX2Y += x * x * y; sumXY2 += x * y * y;
      }
      const A = n * sumX2 - sumX * sumX;
      const B = n * sumXY - sumX * sumY;
      const C = n * sumY2 - sumY * sumY;
      const G = 0.5 * (n * sumX3 + n * sumXY2 - sumX * sumX2 - sumX * sumY2);
      const H = 0.5 * (n * sumY3 + n * sumX2Y - sumY * sumX2 - sumY * sumY2);
      const det = A * C - B * B;
      if (Math.abs(det) < 1e-8) return null;
      const d = (G * C - H * B) / det;
      const e = (A * H - B * G) / det;
      const ncx = -d, ncy = -e;
      // 半徑取到擬合中心的中位數距離
      const rs = pts.map(p => Math.hypot(p.x - ncx, p.y - ncy)).sort((a, b) => a - b);
      return { cx: ncx, cy: ncy, r: rs[Math.floor(rs.length / 2)] };
    }

    /**
     * 在綠色選取範圍內自動找圓心（不依賴手指起點）
     * 作法（避免單邊反光把圓心拉歪）：
     *  1) 圓盤 ROI 內亮度／暗度重心（適合亮孔或暗圓）
     *  2) 等角射線各取一個邊緣點再擬合（每方向一票，避免一側點過多）
     *  3) 以半徑一致性評分做小範圍微調
     */
    function findAutoCenter(imgData, roughCx, roughCy, roughR, expand) {
      const rMax = Math.max(roughR + expand, 8);
      const x0 = Math.max(1, Math.floor(roughCx - rMax));
      const x1 = Math.min(imgData.width - 2, Math.ceil(roughCx + rMax));
      const y0 = Math.max(1, Math.floor(roughCy - rMax));
      const y1 = Math.min(imgData.height - 2, Math.ceil(roughCy + rMax));

      // ---- 1) 亮度／暗度重心（圓孔亮點或暗圓盤都很有效）----
      let sumBrightX = 0, sumBrightY = 0, sumBrightW = 0;
      let sumDarkX = 0, sumDarkY = 0, sumDarkW = 0;
      let graySum = 0, grayCnt = 0;
      const samples = [];
      for (let y = y0; y <= y1; y += 1) {
        for (let x = x0; x <= x1; x += 1) {
          const dist = Math.hypot(x - roughCx, y - roughCy);
          if (dist > rMax) continue;
          const g = sampleGray(imgData, x, y);
          samples.push(g);
          graySum += g;
          grayCnt++;
        }
      }
      if (grayCnt < 20) return { cx: roughCx, cy: roughCy, r: roughR };

      samples.sort((a, b) => a - b);
      const gLow = samples[Math.floor(samples.length * 0.2)];
      const gHigh = samples[Math.floor(samples.length * 0.8)];
      const gMid = (gLow + gHigh) * 0.5;
      const contrast = gHigh - gLow;

      for (let y = y0; y <= y1; y += 1) {
        for (let x = x0; x <= x1; x += 1) {
          const dist = Math.hypot(x - roughCx, y - roughCy);
          if (dist > rMax) continue;
          const g = sampleGray(imgData, x, y);
          // 亮區權重（亮孔）
          const wb = Math.max(0, g - gMid);
          if (wb > 0) {
            const w = wb * wb;
            sumBrightX += x * w;
            sumBrightY += y * w;
            sumBrightW += w;
          }
          // 暗區權重（暗圓）
          const wd = Math.max(0, gMid - g);
          if (wd > 0) {
            const w = wd * wd;
            sumDarkX += x * w;
            sumDarkY += y * w;
            sumDarkW += w;
          }
        }
      }

      let bestCx = roughCx, bestCy = roughCy, bestR = roughR;
      // 對比足夠時採用重心：亮孔用亮重心，暗圓用暗重心
      if (contrast > 12) {
        // 判斷 ROI 中心附近偏亮還偏暗
        const centerGray = sampleGray(imgData, roughCx, roughCy);
        if (centerGray >= gMid && sumBrightW > 1e-3) {
          bestCx = sumBrightX / sumBrightW;
          bestCy = sumBrightY / sumBrightW;
        } else if (centerGray < gMid && sumDarkW > 1e-3) {
          bestCx = sumDarkX / sumDarkW;
          bestCy = sumDarkY / sumDarkW;
        } else if (sumBrightW > sumDarkW && sumBrightW > 1e-3) {
          bestCx = sumBrightX / sumBrightW;
          bestCy = sumBrightY / sumBrightW;
        } else if (sumDarkW > 1e-3) {
          bestCx = sumDarkX / sumDarkW;
          bestCy = sumDarkY / sumDarkW;
        }
        // 重心不可偏離粗選太遠
        if (Math.hypot(bestCx - roughCx, bestCy - roughCy) > Math.max(roughR * 0.45, 16)) {
          bestCx = roughCx;
          bestCy = roughCy;
        }
      }

      // ---- 2) 等角射線：每方向只取一個最強邊緣點，再擬合 ----
      const nRay = 48;
      const rayEdgePts = [];
      const rSearch0 = Math.max(3, roughR * 0.35);
      const rSearch1 = roughR + expand;
      for (let i = 0; i < nRay; i++) {
        const ang = (i / nRay) * Math.PI * 2;
        const cos = Math.cos(ang), sin = Math.sin(ang);
        let bestLocalR = roughR, bestLocalG = -1;
        for (let rad = rSearch0; rad <= rSearch1; rad += 0.5) {
          const g1 = sampleGray(imgData, bestCx + cos * (rad - 0.5), bestCy + sin * (rad - 0.5));
          const g2 = sampleGray(imgData, bestCx + cos * (rad + 0.5), bestCy + sin * (rad + 0.5));
          const deriv = Math.abs(g2 - g1) * edgeGain;
          if (deriv > bestLocalG) {
            bestLocalG = deriv;
            bestLocalR = rad;
          }
        }
        if (bestLocalG > getEdgeThreshold() * 0.05) {
          rayEdgePts.push({
            x: bestCx + cos * bestLocalR,
            y: bestCy + sin * bestLocalR,
            g: bestLocalG
          });
        }
      }

      if (rayEdgePts.length >= 16) {
        const fitted = fitCircleAlgebraic(rayEdgePts);
        if (fitted && Math.hypot(fitted.cx - roughCx, fitted.cy - roughCy) < Math.max(roughR * 0.4, 18)) {
          // 與重心融合：若兩者接近，取平均更穩；差異大則以射線擬合為主（外形圓）
          const d = Math.hypot(fitted.cx - bestCx, fitted.cy - bestCy);
          if (d < Math.max(3, roughR * 0.08)) {
            bestCx = (bestCx + fitted.cx) * 0.5;
            bestCy = (bestCy + fitted.cy) * 0.5;
          } else {
            // 亮孔重心通常更準；若中心區明顯偏亮，保留更多重心權重
            const cg = sampleGray(imgData, bestCx, bestCy);
            if (cg >= gMid && contrast > 20) {
              bestCx = bestCx * 0.65 + fitted.cx * 0.35;
              bestCy = bestCy * 0.65 + fitted.cy * 0.35;
            } else {
              bestCx = fitted.cx;
              bestCy = fitted.cy;
            }
          }
          bestR = fitted.r;
        }
      }

      // ---- 3) 小範圍網格微調：最小化各向半徑標準差 ----
      const searchRad = Math.min(10, Math.max(4, roughR * 0.1));
      const gridStep = 1;
      let bestScore = -1;
      const scoreAngles = 32;

      function scoreCenter(tcx, tcy) {
        const rs = [];
        let sumG = 0;
        for (let i = 0; i < scoreAngles; i++) {
          const ang = (i / scoreAngles) * Math.PI * 2;
          const cos = Math.cos(ang), sin = Math.sin(ang);
          let bestLocalR = bestR, bestLocalG = -1;
          for (let d = -expand; d <= expand; d += 0.5) {
            const rad = bestR + d;
            if (rad < 2) continue;
            const g1 = sampleGray(imgData, tcx + cos * (rad - 0.5), tcy + sin * (rad - 0.5));
            const g2 = sampleGray(imgData, tcx + cos * (rad + 0.5), tcy + sin * (rad + 0.5));
            const deriv = Math.abs(g2 - g1) * edgeGain;
            if (deriv > bestLocalG) {
              bestLocalG = deriv;
              bestLocalR = rad;
            }
          }
          rs.push(bestLocalR);
          sumG += bestLocalG;
        }
        const mean = rs.reduce((a, b) => a + b, 0) / rs.length;
        let varSum = 0;
        for (const v of rs) varSum += (v - mean) * (v - mean);
        const std = Math.sqrt(varSum / rs.length);
        // 標準差權重加大，強迫圓心對準
        return { score: (sumG / rs.length) / (1 + std * 3.5), meanR: mean, std };
      }

      {
        const s = scoreCenter(bestCx, bestCy);
        bestScore = s.score;
        bestR = s.meanR;
      }
      for (let dy = -searchRad; dy <= searchRad; dy += gridStep) {
        for (let dx = -searchRad; dx <= searchRad; dx += gridStep) {
          if (dx === 0 && dy === 0) continue;
          const tcx = bestCx + dx;
          const tcy = bestCy + dy;
          if (Math.hypot(tcx - roughCx, tcy - roughCy) > Math.max(roughR * 0.45, 20)) continue;
          const s = scoreCenter(tcx, tcy);
          if (s.score > bestScore) {
            bestScore = s.score;
            bestCx = tcx;
            bestCy = tcy;
            bestR = s.meanR;
          }
        }
      }

      return { cx: bestCx, cy: bestCy, r: bestR };
    }

    // 圓形：綠色範圍僅作 ROI → 自動找圓心 → 多層半徑（不依賴手指起點當圓心）
    function autoEdgeCircle(roughCx, roughCy, roughR, expand) {
      const imgData = getImageDataSafe();
      if (!imgData) return { cx: roughCx, cy: roughCy, radii: [roughR], outerR: roughR, innerR: null };

      // ---- 0) 自動圓心（核心：不採用手指起點）----
      const autoC = findAutoCenter(imgData, roughCx, roughCy, roughR, expand);
      const cx = autoC.cx;
      const cy = autoC.cy;
      // 外徑搜尋以自動估計半徑為主，仍參考使用者粗選半徑
      const r = autoC.r > 3 ? autoC.r : roughR;

      const maxR = Math.max(r + expand, roughR + expand, 10);
      const minR = 2;
      const angles = 72;
      const step = 0.5;
      const nBins = Math.floor((maxR - minR) / step) + 1;
      const profile = new Float32Array(nBins);
      const profileCnt = new Uint16Array(nBins);

      // ---- 1) 徑向強度梯度剖面 ----
      for (let i = 0; i < angles; i++) {
        const ang = (i / angles) * Math.PI * 2;
        const cos = Math.cos(ang), sin = Math.sin(ang);
        let prevGray = sampleGray(imgData, cx + cos * minR, cy + sin * minR);
        for (let bi = 1; bi < nBins; bi++) {
          const rad = minR + bi * step;
          const g = sampleGray(imgData, cx + cos * rad, cy + sin * rad);
          const deriv = Math.abs(g - prevGray) / step;
          profile[bi] += deriv;
          profileCnt[bi]++;
          prevGray = g;
        }
      }
      for (let bi = 0; bi < nBins; bi++) {
        if (profileCnt[bi] > 0) profile[bi] = (profile[bi] / profileCnt[bi]) * edgeGain;
      }

      // ---- 2) 峰值 + 亞像素 ----
      const threshold = Math.max(2.5, getEdgeThreshold() * 0.08);
      const sortedP = Array.from(profile).filter(v => v > 0).sort((a, b) => a - b);
      const p85 = sortedP.length ? sortedP[Math.floor(sortedP.length * 0.85)] : threshold;
      const peakTh = Math.max(threshold, p85 * 0.35);

      const peaks = [];
      const minPeakDistBins = Math.max(3, Math.round(3 / step));
      for (let bi = 2; bi < nBins - 2; bi++) {
        const v = profile[bi];
        if (v < peakTh) continue;
        if (v >= profile[bi - 1] && v >= profile[bi + 1]) {
          const d = subpixelPeak(profile[bi - 1], profile[bi], profile[bi + 1]);
          const rad = minR + (bi + d) * step;
          let keep = true;
          for (let k = 0; k < peaks.length; k++) {
            if (Math.abs(peaks[k].r - rad) < minPeakDistBins * step) {
              if (v > peaks[k].g) peaks[k] = { r: rad, g: v, bi };
              keep = false;
              break;
            }
          }
          if (keep) peaks.push({ r: rad, g: v, bi });
        }
      }

      if (peaks.length === 0) {
        return { cx, cy, radii: [r], outerR: r, innerR: null, autoCenter: true };
      }

      // ---- 3) 外徑：靠近自動估計 r（或使用者粗選）的強峰 ----
      let outerPeak = null;
      let bestScore = -1;
      const refR = r;
      for (const p of peaks) {
        const dist = Math.abs(p.r - refR);
        if (dist <= expand + 4) {
          const score = p.g / (1 + dist * 0.35);
          if (score > bestScore) {
            bestScore = score;
            outerPeak = p;
          }
        }
      }
      if (!outerPeak) {
        peaks.sort((a, b) => Math.abs(a.r - refR) - Math.abs(b.r - refR));
        outerPeak = peaks[0];
      }

      // ---- 4) 各角度亞像素精修外徑（0.25px 取樣 + 5 點高斯／二次擬合 + 半高交越）----
      const rayRs = [];
      const searchHalf = Math.min(expand, 12);
      for (let i = 0; i < angles; i++) {
        const ang = (i / angles) * Math.PI * 2;
        const cos = Math.cos(ang), sin = Math.sin(ang);
        const edgeR = radialEdgeSubpixel(imgData, cx, cy, cos, sin, outerPeak.r, searchHalf);
        if (edgeR > 2) rayRs.push(edgeR);
      }
      rayRs.sort((a, b) => a - b);
      // 去掉兩端極端值再取中位，降低單邊反光影響
      let outerR = outerPeak.r;
      if (rayRs.length >= 8) {
        const trim = Math.floor(rayRs.length * 0.1);
        const clipped = rayRs.slice(trim, rayRs.length - trim);
        outerR = clipped[Math.floor(clipped.length / 2)];
      } else if (rayRs.length) {
        outerR = rayRs[Math.floor(rayRs.length / 2)];
      }

      // ---- 5) 內徑多層（同樣用半高法精修）----
      const innerPeaks = peaks
        .filter(p => p.r < outerR - 3 && p.g >= peakTh * 0.7)
        .sort((a, b) => b.r - a.r);

      const refinedInners = [];
      for (const ip of innerPeaks) {
        const irs = [];
        for (let i = 0; i < 36; i++) {
          const ang = (i / 36) * Math.PI * 2;
          const cos = Math.cos(ang), sin = Math.sin(ang);
          let peakR = ip.r, bestD = -1;
          for (let d = -4; d <= 4; d += 0.5) {
            const rad = ip.r + d;
            if (rad < 2 || rad > outerR - 2) continue;
            const g1 = sampleGray(imgData, cx + cos * (rad - 0.5), cy + sin * (rad - 0.5));
            const g2 = sampleGray(imgData, cx + cos * (rad + 0.5), cy + sin * (rad + 0.5));
            const deriv = Math.abs(g2 - g1);
            if (deriv > bestD) { bestD = deriv; peakR = rad; }
          }
          if (bestD < peakTh * 0.35) continue;

          const gIn = sampleGray(imgData, cx + cos * Math.max(1.5, peakR - 2.5), cy + sin * Math.max(1.5, peakR - 2.5));
          const gOut = sampleGray(imgData, cx + cos * (peakR + 2.5), cy + sin * (peakR + 2.5));
          const mid = (gIn + gOut) * 0.5;
          if (Math.abs(gOut - gIn) < 5) {
            irs.push(peakR);
            continue;
          }
          let edgeR = peakR;
          let prevG = sampleGray(imgData, cx + cos * (peakR - 2), cy + sin * (peakR - 2));
          let prevR = peakR - 2;
          for (let rad = peakR - 2 + 0.25; rad <= peakR + 2; rad += 0.25) {
            const g = sampleGray(imgData, cx + cos * rad, cy + sin * rad);
            if ((prevG - mid) * (g - mid) <= 0 && Math.abs(g - prevG) > 1e-3) {
              const t = (mid - prevG) / (g - prevG);
              edgeR = prevR + 0.25 * Math.max(0, Math.min(1, t));
              break;
            }
            prevG = g;
            prevR = rad;
          }
          irs.push(edgeR);
        }
        if (irs.length >= 10) {
          irs.sort((a, b) => a - b);
          const trim = Math.floor(irs.length * 0.1);
          const clipped = irs.slice(trim, irs.length - trim);
          refinedInners.push(clipped[Math.floor(clipped.length / 2)]);
        }
      }

      const radii = [outerR];
      for (const ir of refinedInners) {
        if (radii.every(x => Math.abs(x - ir) >= 2)) radii.push(ir);
      }
      radii.sort((a, b) => b - a);

      return {
        cx,
        cy,
        radii,
        outerR: radii[0],
        innerR: radii.length > 1 ? radii[1] : null,
        autoCenter: true
      };
    }

    // 最近一次自動邊緣得到的像素距離（供校正使用）
    let lastPixelForCalib = 0;

    // ==================== 執行量測（綠色區塊 + 自動邊緣） ====================
    function showEdgeGainControls(show) {
      const row = document.getElementById('edge-gain-row');
      if (row) row.style.display = show ? 'flex' : 'none';
      const nudge = document.getElementById('center-nudge-wrap');
      if (nudge) {
        const isCircle = show && lastResult && lastResult.tool === 'circle';
        nudge.style.display = isCircle ? 'inline-flex' : 'none';
      }
    }

    // 從指定圓心重算各層半徑（手動微調圓心後使用，保持與實體對位）
    function refineCircleFromCenter(cx, cy, approxR) {
      const imgData = getImageDataSafe();
      if (!imgData) return null;
      const expand = 16;
      const angles = 48;
      const searchHalf = Math.min(expand, 12);
      // 外徑：亞像素射線
      const rayRs = [];
      for (let i = 0; i < angles; i++) {
        const ang = (i / angles) * Math.PI * 2;
        const cos = Math.cos(ang), sin = Math.sin(ang);
        const edgeR = radialEdgeSubpixel(imgData, cx, cy, cos, sin, approxR, searchHalf);
        if (edgeR > 2) rayRs.push(edgeR);
      }
      if (!rayRs.length) return { cx, cy, outerR: approxR, radii: [approxR], innerR: null };
      rayRs.sort((a, b) => a - b);
      const trim = Math.floor(rayRs.length * 0.1);
      const clipped = rayRs.length >= 8 ? rayRs.slice(trim, rayRs.length - trim) : rayRs;
      const outerR = clipped[Math.floor(clipped.length / 2)];

      // 保留既有內徑層相對比例粗估：在新圓心下對原內徑再精修
      const radii = [outerR];
      const prevRadii = (lastResult && lastResult.radii) ? lastResult.radii.slice(1) : [];
      for (const ir0 of prevRadii) {
        if (ir0 >= outerR - 2) continue;
        const irs = [];
        for (let i = 0; i < 24; i++) {
          const ang = (i / 24) * Math.PI * 2;
          const cos = Math.cos(ang), sin = Math.sin(ang);
          let peakR = ir0, bestD = -1;
          for (let d = -3; d <= 3; d += 0.5) {
            const rad = ir0 + d;
            if (rad < 2 || rad > outerR - 2) continue;
            const g1 = sampleGray(imgData, cx + cos * (rad - 0.5), cy + sin * (rad - 0.5));
            const g2 = sampleGray(imgData, cx + cos * (rad + 0.5), cy + sin * (rad + 0.5));
            const deriv = Math.abs(g2 - g1);
            if (deriv > bestD) { bestD = deriv; peakR = rad; }
          }
          if (bestD > 2) irs.push(peakR);
        }
        if (irs.length >= 8) {
          irs.sort((a, b) => a - b);
          radii.push(irs[Math.floor(irs.length / 2)]);
        }
      }
      radii.sort((a, b) => b - a);
      return { cx, cy, outerR: radii[0], radii, innerR: radii.length > 1 ? radii[1] : null, autoCenter: true };
    }

    function applyCircleResult(edges) {
      lastResult = { tool: 'circle', ...edges };
      greenRegion = {
        type: 'circle',
        cx: edges.cx,
        cy: edges.cy,
        r: edges.outerR,
        expand: 6
      };
      if (lastSelection && lastSelection.tool === 'circle') {
        lastSelection.p0 = { x: edges.cx, y: edges.cy };
        lastSelection.p1 = { x: edges.cx + edges.outerR, y: edges.cy };
      }
      lastPixelForCalib = edges.outerR * 2;
      showEdgeGainControls(true);
      updateCircleResultText();
      drawOverlay();
    }

    // 僅平移圓心，不重算外徑（方便先對位再調半徑或按需重算）
    function nudgeCircleCenter(dx, dy) {
      if (!lastResult || lastResult.tool !== 'circle') return;
      lastResult.cx += dx;
      lastResult.cy += dy;
      if (lastResult.radii) {
        // radii 數值不變，僅中心移動
      }
      if (greenRegion && greenRegion.type === 'circle') {
        greenRegion.cx = lastResult.cx;
        greenRegion.cy = lastResult.cy;
      }
      if (lastSelection && lastSelection.tool === 'circle') {
        lastSelection.p0 = { x: lastResult.cx, y: lastResult.cy };
        lastSelection.p1 = { x: lastResult.cx + lastResult.outerR, y: lastResult.cy };
      }
      updateCircleResultText();
      drawOverlay();
    }

    // 手動微調外徑像素（±），不改變圓心
    function nudgeCircleRadius(dr) {
      if (!lastResult || lastResult.tool !== 'circle') return;
      const newR = Math.max(2, (lastResult.outerR || 10) + dr);
      lastResult.outerR = newR;
      if (lastResult.radii && lastResult.radii.length) {
        lastResult.radii[0] = newR;
      } else {
        lastResult.radii = [newR];
      }
      // 內徑若超過外徑則剔除
      if (lastResult.radii.length > 1) {
        lastResult.radii = lastResult.radii.filter((r, i) => i === 0 || r < newR - 1);
        lastResult.innerR = lastResult.radii.length > 1 ? lastResult.radii[1] : null;
      }
      if (greenRegion && greenRegion.type === 'circle') {
        greenRegion.r = newR;
      }
      if (lastSelection && lastSelection.tool === 'circle') {
        lastSelection.p1 = { x: lastResult.cx + newR, y: lastResult.cy };
      }
      lastPixelForCalib = newR * 2;
      updateCircleResultText();
      drawOverlay();
    }

    function updateCircleResultText() {
      if (!lastResult || lastResult.tool !== 'circle') return;
      const outerR = lastResult.outerR;
      const outerPx = outerR * 2;
      const radii = lastResult.radii || [outerR];
      const label = document.getElementById('radius-px-label');
      if (label) label.textContent = outerPx.toFixed(1) + ' px';

      if (pixelsPerUnit > 0) {
        let html = `圓形（手動微調中，共 ${radii.length} 層）`;
        radii.forEach((rad, idx) => {
          const d = (rad * 2) / pixelsPerUnit;
          const pxD = rad * 2;
          if (idx === 0) {
            html += `<br><strong>外徑：${d.toFixed(3)} ${currentUnit}</strong> <span style="color:#94a3b8;font-size:11px;">(${pxD.toFixed(1)} px)</span>`;
          } else {
            html += `<br>內徑 ${idx}：${d.toFixed(3)} ${currentUnit} <span style="color:#94a3b8;font-size:11px;">(${pxD.toFixed(1)} px)</span>`;
          }
        });
        document.getElementById('result-text').innerHTML = html;
      } else {
        lastPixelForCalib = outerPx;
        document.getElementById('result-text').innerHTML =
          `校正用圓形<br>` +
          `外徑像素：<strong>${outerPx.toFixed(1)} px</strong><br>` +
          `可拖＋移圓心、拖粉紅圈或按 ± 調外徑，對齊後輸入實際尺寸並「完成校正」。`;
      }
    }

    function refineCircleAtCurrentCenter() {
      if (!lastResult || lastResult.tool !== 'circle') return;
      const edges = refineCircleFromCenter(lastResult.cx, lastResult.cy, lastResult.outerR || 10);
      if (edges) applyCircleResult(edges);
    }

    function performMeasure() {
      if (!isCaptured) {
        alert('請先擷取影像');
        return;
      }
      // 優先用當前暫存點；若已清空（量測完成後），改用 lastSelection 重算
      let p0 = measurePoints[0];
      let p1 = measurePoints[1] || liveEnd;
      let tool = currentTool;
      if ((!p0 || !p1) && lastSelection) {
        p0 = lastSelection.p0;
        p1 = lastSelection.p1;
        tool = lastSelection.tool || currentTool;
      }
      if (!p0 || !p1) return;
      const bandW = 16; // 綠色半寬
      // 選取完成後顯示增益調整列，方便即時過濾雜訊
      showEdgeGainControls(true);

      if (tool === 'line') {
        greenRegion = { type: 'band', x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y, width: bandW };
        const edges = autoEdgeLine(p0.x, p0.y, p1.x, p1.y, bandW);
        const pixelDist = Math.hypot(edges.end.x - edges.start.x, edges.end.y - edges.start.y);
        lastPixelForCalib = pixelDist;
        lastResult = {
          tool: 'line',
          autoStart: edges.start,
          autoEnd: edges.end,
          pixel: pixelDist,
          real: pixelsPerUnit > 0 ? pixelDist / pixelsPerUnit : null
        };

        if (pixelsPerUnit > 0) {
          const real = pixelDist / pixelsPerUnit;
          document.getElementById('result-text').innerHTML =
            `兩點距離（自動邊緣）<br>` +
            `像素距離：${pixelDist.toFixed(1)} px<br>` +
            `<strong>實際尺寸：${real.toFixed(3)} ${currentUnit}</strong>`;
        } else {
          document.getElementById('result-text').innerHTML =
            `校正用兩點距離（自動邊緣）<br>` +
            `偵測到像素距離：<strong>${pixelDist.toFixed(1)} px</strong><br>` +
            `請在上方輸入此段的「實際尺寸」，然後按「完成校正」。`;
        }
      }
      else if (tool === 'rect') {
        const x = Math.min(p0.x, p1.x);
        const y = Math.min(p0.y, p1.y);
        const w = Math.abs(p1.x - p0.x);
        const h = Math.abs(p1.y - p0.y);
        const expand = 12;
        greenRegion = { type: 'rect', x: x - expand, y: y - expand, w: w + expand*2, h: h + expand*2 };
        const edges = autoEdgeRect(x, y, w, h, expand);
        lastResult = { tool: 'rect', ...edges };

        if (pixelsPerUnit > 0) {
          const ow = edges.outer.w / pixelsPerUnit;
          const oh = edges.outer.h / pixelsPerUnit;
          let html = `矩形（自動邊緣）<br>外框：${ow.toFixed(3)} × ${oh.toFixed(3)} ${currentUnit}`;
          if (edges.inner) {
            const iw = edges.inner.w / pixelsPerUnit;
            const ih = edges.inner.h / pixelsPerUnit;
            const thickW = (edges.outer.w - edges.inner.w) / 2 / pixelsPerUnit;
            const thickH = (edges.outer.h - edges.inner.h) / 2 / pixelsPerUnit;
            html += `<br>內框：${iw.toFixed(3)} × ${ih.toFixed(3)} ${currentUnit}`;
            html += `<br>壁厚（約）：水平 ${thickW.toFixed(3)} / 垂直 ${thickH.toFixed(3)} ${currentUnit}`;
          }
          document.getElementById('result-text').innerHTML = html;
        } else {
          document.getElementById('result-text').innerHTML =
            `矩形邊緣已偵測（尚未校正）<br>請先用「兩點距離」對已知尺寸物件完成校正。`;
        }
      }
      else if (tool === 'circle') {
        const r = Math.hypot(p1.x - p0.x, p1.y - p0.y);
        const expand = 16;
        const edges = autoEdgeCircle(p0.x, p0.y, r, expand);
        applyCircleResult(edges);
        return; // applyCircleResult 已 drawOverlay
      }
      drawOverlay();
    }

    // ==================== 事件處理 ====================
    function getPos(e) {
      const rect = overlay.getBoundingClientRect();
      // touchend 時 touches 為空，改用 changedTouches
      const t = (e.touches && e.touches[0])
        || (e.changedTouches && e.changedTouches[0])
        || e;
      const clientX = t.clientX;
      const clientY = t.clientY;
      // 顯示尺寸可能因 CSS 縮放與緩衝像素不同，需換算回 canvas／overlay 座標
      const scaleX = rect.width > 0 ? (overlay.width / rect.width) : 1;
      const scaleY = rect.height > 0 ? (overlay.height / rect.height) : 1;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    // 完成一次量測選取（共用：拖曳放開 或 第二次點擊）
    function finishMeasureSelection(p0, p1) {
      liveEnd = p1;
      measurePoints = [p0, p1];
      lastSelection = {
        tool: currentTool,
        p0: { x: p0.x, y: p0.y },
        p1: { x: p1.x, y: p1.y }
      };
      dragging = null;
      performMeasure();
      // 必須清空粗選暫存並重繪，否則會殘留紫色虛線（使用者拖曳圓）
      measurePoints = [];
      liveEnd = null;
      drawOverlay();
    }

    // 尺規拖曳
    function onPointerDown(e) {
      // 數位縮放後：Alt＋拖曳 或 雙指平移
      if (isCaptured && viewZoom > 1.01 && (e.altKey || (e.touches && e.touches.length >= 2))) {
        e.preventDefault();
        const t = e.touches && e.touches.length ? e.touches[0] : e;
        viewPanning = { x0: t.clientX, y0: t.clientY, panX0: viewPanX, panY0: viewPanY };
        dragging = { type: 'view-pan' };
        return;
      }

      // 量測 / 校正選取模式（已擷取影像後）
      if (isCaptured && currentTool) {
        e.preventDefault();
